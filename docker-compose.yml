services:
  # Traefik liest die Docker-API nur über diesen Proxy (Audit MAIN-OPS-004): der rohe Socket ist
  # root-äquivalent, Traefik hängt am Internet. Erlaubt sind nur GET auf Container, Events,
  # Ping und Version - genau das, was der Docker-Provider braucht (live geprüft 2026-10-16:
  # Router, später gestartete Container über Events; POST, /info, /secrets, exec -> 403).
  traefik-socket-proxy:
    image: lscr.io/linuxserver/socket-proxy:3.4.6-r0-ls101@sha256:362cadf55b3c7920189347d0f4d60b389e2f80e929581bf10793f2371aab41e5
    restart: unless-stopped
    mem_limit: 64m
    cpus: 0.25
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /run
    environment:
      CONTAINERS: 1
      EVENTS: 1
      PING: 1
      VERSION: 1
      POST: 0
      LOG_LEVEL: warning
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - traefik-docker-api
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  traefik:
    # Gleiche Version wie docker-compose.traefik.yml: v3.1 spricht die Docker-API 1.24 fest an
    # und laedt gegen Docker Engine >= 29 keine Router (Audit MAIN-OPS-007).
    image: traefik:v3.6.1@sha256:fd5932c796f7e2db9fd6bff485ef693d53797f0ee8ad03dc68aa424ea6f21958
    restart: unless-stopped
    # M28 (Mittel, Audit 2026-08-12): Ceiling gegen einen durchgehenden Container, der den
    # ganzen (knappen) Host mitreisst - keine Zielwerte fuer Normalbetrieb, nur eine Obergrenze.
    mem_limit: 128m
    cpus: 0.5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      - frontend
      - backend
      - traefik-socket-proxy
    environment:
      TRAEFIK_CERTIFICATESRESOLVERS_LETSENCRYPT_ACME_EMAIL: ${ACME_EMAIL}
      TRAEFIK_CERTIFICATESRESOLVERS_LETSENCRYPTDNS_ACME_EMAIL: ${ACME_EMAIL}
      CF_DNS_API_TOKEN: ${CF_DNS_API_TOKEN}
    ports:
      - "80:80"
      - "443:443"
      # Nur lokal gebunden: vorgesehen als Ziel fuer den OpenZiti-Host-Tunnel.
      - "127.0.0.1:${TRAEFIK_ADMIN_PORT:-8443}:8443"
    networks:
      - default
      - traefik-docker-api
    volumes:
      - ./infra/traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./infra/traefik/letsencrypt:/letsencrypt
      # Vom backend generierte Router pro Mandanten-Custom-Domain (siehe traefik_config_service.py)
      - ./infra/traefik/dynamic:/etc/traefik/dynamic:ro
    command:
      - --configFile=/etc/traefik/traefik.yml

  db:
    image: postgres:16@sha256:ca0bd484cb98bf4b24eb1010e73fb3fcbd6714d240fbc1a10eea5b7dbecb641d
    restart: unless-stopped
    mem_limit: 768m
    cpus: 1.0
    # Audit finding, 2026-08-26: Postgres ran with pure factory defaults (shared_buffers
    # 128MB, effective_cache_size 4GB(!) despite this container's 768m mem_limit above -
    # a wrong effective_cache_size misleads the query planner's cost estimates) and no
    # pg_stat_statements, so there was no way to see which queries are actually
    # expensive/frequent in production. shared_buffers/effective_cache_size/work_mem sized
    # off the 768m limit above (25%/~60%/conservative per-connection); adjust together if
    # mem_limit changes. pg_stat_statements needs shared_preload_libraries at server start
    # (can't be added later via ALTER SYSTEM) - the extension itself still needs
    # `CREATE EXTENSION IF NOT EXISTS pg_stat_statements;` run once (superuser) before
    # pg_stat_statements/pg_stat_statements_* views become queryable.
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - pg_stat_statements.max=5000
      - -c
      - pg_stat_statements.track=all
      - -c
      - shared_buffers=192MB
      - -c
      - effective_cache_size=460MB
      - -c
      - work_mem=8MB
      - -c
      - maintenance_work_mem=64MB
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    env_file:
      - path: .env
        required: false
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      # Nur an localhost gebunden (z.B. fuer SSH-Tunnel-Debugging) - vorher an
      # 0.0.0.0 gebunden und damit ohne Firewall direkt aus dem Internet erreichbar.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
    restart: unless-stopped
    mem_limit: 128m
    cpus: 0.5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # Eigenes internes Netz nur zwischen Backend und Redis (Audit MAIN-OPS-005): Redis haelt
    # Domain-Bridge- und MFA-Flow-Tokens sowie Lockout-Zaehler ohne eigene Authentifizierung. Im
    # Default-Netz haette jeder kompromittierte oeffentliche Dienst (abgabebox, Frontends) daraus
    # eine Sitzung als beliebiger Nutzer erzeugen koennen.
    networks:
      - cache
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Nur-Lese-Zugang zur Docker-API für den Systemstatus (/admin/system). Das Backend bekommt nie
  # den Docker-Socket selbst (Socket = root auf dem Host); der Proxy erlaubt nur GET auf
  # /containers, /_ping und /version (alles andere 403, getestet 2026-10-11). Eigenes internes Netz
  # docker-api: nur das Backend erreicht ihn - die öffentlich erreichbaren Dienste (abgabebox,
  # Frontends) könnten sonst die Umgebungsvariablen aller Container auslesen.
  docker-socket-proxy:
    image: lscr.io/linuxserver/socket-proxy:3.4.6-r0-ls101@sha256:362cadf55b3c7920189347d0f4d60b389e2f80e929581bf10793f2371aab41e5
    restart: unless-stopped
    mem_limit: 64m
    cpus: 0.25
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /run
    environment:
      CONTAINERS: 1
      PING: 1
      VERSION: 1
      POST: 0
      LOG_LEVEL: warning
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - docker-api
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  backend:
    build:
      context: ./backend
    # Der lokale/source-basierte Stack bind-mountet den Quellcode und fuehrt Dev-Builds
    # aus. Release-Deployments nutzen stattdessen den gehaerteten Non-Root-Service aus
    # docker-compose.release.yml.
    user: "0:0"
    restart: unless-stopped
    # Zwei Worker und die Bildverarbeitung teilen sich dieses Budget. ZIPs werden
    # auf Platte gepuffert; im Speicher liegen höchstens vier Bilder à 100 MiB plus Decoder.
    mem_limit: 6144m
    cpus: 1.5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    env_file:
      - path: .env
        required: false
    environment:
      # Steuerbar fuer eine Instanz mit Echtdaten aus diesem Stack (Audit MAIN-OPS-009): dort
      # HOCX_ENVIRONMENT=production in .env setzen, sonst sind /docs und /openapi.json offen und
      # die Produktionssperren aus. docker-compose.dev.yml pinnt development.
      HOCX_ENVIRONMENT: ${HOCX_ENVIRONMENT:-development}
      DATABASE_URL: ${DATABASE_URL}
      APP_DATABASE_URL: ${APP_DATABASE_URL}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
      PYTHONPATH: /app
      STORAGE_ROOT: /app/storage
      EXPORT_ROOT: /app/storage/exports
      UPLOAD_ROOT: /app/storage/uploads
      THUMBNAIL_ROOT: /app/storage-local/thumbnails
      ABGABEBOX_STORAGE_ROOT: /app/abgabebox-storage
      ABGABEBOX_DB_PASSWORD: ${ABGABEBOX_DB_PASSWORD}
      # Migration 0067 creates the hocx_photo_worker role (see photo-analysis-worker/) -
      # needed here too since this service's `command` below runs `alembic upgrade head`.
      PHOTO_WORKER_DB_PASSWORD: ${PHOTO_WORKER_DB_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      # `env_file: .env` below always loads the *literal* .env file, regardless of which
      # --env-file was passed to `docker compose` (e2e/tests pass a different one) - only
      # keys interpolated here via ${...} correctly reflect that override. These four are
      # the ones app/core/config.py reads directly (AUTH_SECRET/ADMIN_AUTH_SECRET session
      # signing, INITIAL_ADMIN_EMAIL/PASSWORD platform-admin bootstrap, POSTGRES_USER for
      # this migration's admin-role grants) - without them e2e/tests silently ran with this
      # host's real dev secrets instead of their own isolated ones.
      POSTGRES_USER: ${POSTGRES_USER}
      AUTH_SECRET: ${AUTH_SECRET}
      ADMIN_AUTH_SECRET: ${ADMIN_AUTH_SECRET}
      INITIAL_ADMIN_EMAIL: ${INITIAL_ADMIN_EMAIL}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD}
      CLAMAV_HOST: clamav
      REDIS_URL: redis://redis:6379/0
      DOCKER_API_URL: http://docker-socket-proxy:2375
      TRAEFIK_DYNAMIC_CONFIG_DIR: /app/traefik_dynamic
      ROUTER_PREFIX: hocx
      TRAEFIK_MIDDLEWARE_PREFIX: ""
      # Objektspeicher (docs-site/docs/technik/storage/): Schlüssel für Profil-Zugangsdaten und lokales Garage-S3.
      STORAGE_CREDENTIALS_KEY: ${STORAGE_CREDENTIALS_KEY:-}
      STORAGE_WORK_ROOT: /app/storage-local/work
      LOCAL_S3_ENDPOINT: http://local-s3:3900
      LOCAL_S3_BUCKET: hocx-main
      LOCAL_S3_ABGABEBOX_BUCKET: hocx-abgabebox
      LOCAL_S3_ACCESS_KEY: ${LOCAL_S3_ACCESS_KEY:-}
      LOCAL_S3_SECRET_KEY: ${LOCAL_S3_SECRET_KEY:-}
      LOCAL_S3_ABGABEBOX_ACCESS_KEY: ${LOCAL_S3_ABGABEBOX_ACCESS_KEY:-}
      LOCAL_S3_ABGABEBOX_SECRET_KEY: ${LOCAL_S3_ABGABEBOX_SECRET_KEY:-}
    networks:
      - default
      - docker-api
      - storage
      - cache
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
      # HOCX_STORAGE_PATH (.env) zeigt lokal auf ./storage; sobald ein Cloud Volume gemountet
      # ist, dort umbiegen - kein Compose-/Code-Aendern noetig.
      - ${HOCX_STORAGE_PATH:-./storage}:/app/storage
      # Bewusst NICHT ueber HOCX_STORAGE_PATH gesteuert - dieser Ordner bleibt IMMER lokal,
      # auch wenn /app/storage spaeter auf ein Netzwerk-/Cloud-Volume umgehaengt wird
      # (siehe FileService.ensure_thumbnail).
      - ./storage-local/thumbnails:/app/storage-local/thumbnails
      - ./storage-local/work:/app/storage-local/work
      # Zugriff auf die von der Abgabebox geschriebenen Dateien fuer Admin-Downloads
      # und zum Loeschen beim "Wieder aufschalten" (siehe submission_service.py).
      # Read-write, da das Haupt-Backend ohnehin voll vertrauenswuerdig ist - die
      # eigentliche Isolationsgrenze ist die restricted DB-Rolle des abgabebox-backend,
      # nicht dieser Mount.
      - ${HOCX_STORAGE_PATH:-./storage}/abgabebox-uploads:/app/abgabebox-storage
      # Generiert die Router fuer Mandanten-Custom-Domains, gemeinsam mit Traefik (ro-Mount oben)
      - ./infra/traefik/dynamic:/app/traefik_dynamic
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2 --timeout-keep-alive 75"
    healthcheck:
      # Kein curl im python:3.13-slim-Image (siehe Audit) - urllib aus der Stdlib genuegt fuer
      # einen simplen Liveness-Check gegen den Health-Endpoint aus app/main.py.
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    labels:
      - "traefik.enable=true"
      # Das Backend hängt zusätzlich im internen Netz docker-api - ohne diese Angabe wählt Traefik
      # je nach Reihenfolge die dort unerreichbare IP.
      - "traefik.docker.network=${COMPOSE_PROJECT_NAME}_default"
      # Main API router (all non-auth paths)
      - "traefik.http.routers.hocx-backend.rule=Host(`${TRAEFIK_DOMAIN}`) && ((PathPrefix(`/api`) && !PathPrefix(`/api/admin`)) || PathPrefix(`/docs`) || PathPrefix(`/openapi.json`))"
      - "traefik.http.routers.hocx-backend.middlewares=api-inflight"
      - "traefik.http.routers.hocx-backend.entrypoints=websecure"
      - "traefik.http.routers.hocx-backend.tls.certresolver=letsencrypt"
      - "traefik.http.routers.hocx-backend.priority=100"
      - "traefik.http.routers.hocx-backend.service=hocx-backend"
      - "traefik.http.services.hocx-backend.loadbalancer.server.port=8000"
      - "traefik.http.middlewares.api-inflight.inflightreq.amount=100"
      - "traefik.http.middlewares.api-inflight.inflightreq.sourcecriterion.ipstrategy.depth=0"
      # Platform-Admin-API: nur auf dem lokal gebundenen OpenZiti-EntryPoint.
      - "traefik.http.routers.hocx-admin-api.rule=Host(`${TRAEFIK_ADMIN_DOMAIN}`) && PathPrefix(`/api/admin`)"
      - "traefik.http.routers.hocx-admin-api.entrypoints=adminsecure"
      - "traefik.http.routers.hocx-admin-api.tls.certresolver=letsencryptdns"
      - "traefik.http.routers.hocx-admin-api.priority=100"
      - "traefik.http.routers.hocx-admin-api.service=hocx-admin-api"
      - "traefik.http.services.hocx-admin-api.loadbalancer.server.port=8000"
      # Dedicated router for the login endpoint specifically, with rate limiting - narrowly
      # scoped to just POST /api/auth/login (not all of /api/auth/*), since /api/auth/session
      # and /api/auth/tenant-by-domain are read-only, non-brute-forceable, and get polled on
      # every page load/navigation; sharing the login rate-limit budget with them meant a normal
      # user browsing the app or reloading the login page could exhaust it and see broken
      # tenant-branding lookups or spurious "logged out" states.
      - "traefik.http.routers.hocx-auth.rule=Host(`${TRAEFIK_DOMAIN}`) && Path(`/api/auth/login`) && Method(`POST`)"
      - "traefik.http.routers.hocx-auth.entrypoints=websecure"
      - "traefik.http.routers.hocx-auth.tls.certresolver=letsencrypt"
      - "traefik.http.routers.hocx-auth.priority=200"
      - "traefik.http.routers.hocx-auth.service=hocx-auth"
      - "traefik.http.routers.hocx-auth.middlewares=auth-ratelimit"
      - "traefik.http.services.hocx-auth.loadbalancer.server.port=8000"
      # Rate limit: max 10 login attempts per minute per IP
      - "traefik.http.middlewares.auth-ratelimit.ratelimit.average=10"
      - "traefik.http.middlewares.auth-ratelimit.ratelimit.burst=5"
      - "traefik.http.middlewares.auth-ratelimit.ratelimit.period=1m"
      # Dedicated router for the platform-admin login, same rationale/pattern as hocx-auth
      # above - was previously falling through to the generic hocx-backend router with no
      # rate limiting at all, leaving the highest-privilege account unprotected from bruteforce.
      - "traefik.http.routers.hocx-admin-auth.rule=Host(`${TRAEFIK_ADMIN_DOMAIN}`) && Path(`/api/admin/auth/login`) && Method(`POST`)"
      - "traefik.http.routers.hocx-admin-auth.entrypoints=adminsecure"
      - "traefik.http.routers.hocx-admin-auth.tls.certresolver=letsencryptdns"
      - "traefik.http.routers.hocx-admin-auth.priority=200"
      - "traefik.http.routers.hocx-admin-auth.service=hocx-admin-auth"
      - "traefik.http.routers.hocx-admin-auth.middlewares=auth-ratelimit"
      - "traefik.http.services.hocx-admin-auth.loadbalancer.server.port=8000"
      # Audit finding, 2026-08-27: /api/auth/mfa/totp/verify and /api/auth/tenant-by-domain
      # previously fell through to the generic hocx-backend router with no Traefik-level rate
      # limit at all, unlike /api/auth/login - defense in depth on top of the backend's own
      # (in-progress, per-account) rate limiting for these two endpoints.
      # TOTP verify: slightly more permissive than login's 10/min, since a legitimate user
      # may retry a mistyped code a couple of times.
      - "traefik.http.routers.hocx-mfa-totp-verify.rule=Host(`${TRAEFIK_DOMAIN}`) && Path(`/api/auth/mfa/totp/verify`) && Method(`POST`)"
      - "traefik.http.routers.hocx-mfa-totp-verify.entrypoints=websecure"
      - "traefik.http.routers.hocx-mfa-totp-verify.tls.certresolver=letsencrypt"
      - "traefik.http.routers.hocx-mfa-totp-verify.priority=200"
      - "traefik.http.routers.hocx-mfa-totp-verify.service=hocx-mfa-totp-verify"
      - "traefik.http.routers.hocx-mfa-totp-verify.middlewares=mfa-totp-verify-ratelimit"
      - "traefik.http.services.hocx-mfa-totp-verify.loadbalancer.server.port=8000"
      - "traefik.http.middlewares.mfa-totp-verify-ratelimit.ratelimit.average=20"
      - "traefik.http.middlewares.mfa-totp-verify-ratelimit.ratelimit.burst=10"
      - "traefik.http.middlewares.mfa-totp-verify-ratelimit.ratelimit.period=1m"
      # tenant-by-domain: public, unauthenticated lookup polled on every page load
      # pre-login - looser than login so normal login-page usage never trips it.
      - "traefik.http.routers.hocx-tenant-by-domain.rule=Host(`${TRAEFIK_DOMAIN}`) && Path(`/api/auth/tenant-by-domain`) && Method(`GET`)"
      - "traefik.http.routers.hocx-tenant-by-domain.entrypoints=websecure"
      - "traefik.http.routers.hocx-tenant-by-domain.tls.certresolver=letsencrypt"
      - "traefik.http.routers.hocx-tenant-by-domain.priority=200"
      - "traefik.http.routers.hocx-tenant-by-domain.service=hocx-tenant-by-domain"
      - "traefik.http.routers.hocx-tenant-by-domain.middlewares=tenant-by-domain-ratelimit"
      - "traefik.http.services.hocx-tenant-by-domain.loadbalancer.server.port=8000"
      - "traefik.http.middlewares.tenant-by-domain-ratelimit.ratelimit.average=30"
      - "traefik.http.middlewares.tenant-by-domain-ratelimit.ratelimit.burst=15"
      - "traefik.http.middlewares.tenant-by-domain-ratelimit.ratelimit.period=1m"
      # Mandantenimporte koennen bis zu 2 GiB gross sein (siehe
      # MAX_TENANT_IMPORT_UPLOAD_BYTES in backend/app/api/routes/admin.py). Ein eigener
      # Router begrenzt nur diesen privilegierten Upload; 2050 MiB enthalten etwas Reserve
      # fuer den multipart/form-data-Overhead um die maximal grosse ZIP-Datei.
      - "traefik.http.routers.hocx-tenant-import.rule=Host(`${TRAEFIK_ADMIN_DOMAIN}`) && Path(`/api/admin/tenants/import`) && Method(`POST`)"
      - "traefik.http.routers.hocx-tenant-import.entrypoints=adminsecure"
      - "traefik.http.routers.hocx-tenant-import.tls.certresolver=letsencryptdns"
      - "traefik.http.routers.hocx-tenant-import.priority=200"
      - "traefik.http.routers.hocx-tenant-import.service=hocx-tenant-import"
      - "traefik.http.routers.hocx-tenant-import.middlewares=tenant-import-body-limit"
      - "traefik.http.services.hocx-tenant-import.loadbalancer.server.port=8000"
      - "traefik.http.middlewares.tenant-import-body-limit.buffering.maxRequestBodyBytes=2149580800"
      # Dedicated router for the Word/PDF/ZIP import upload endpoints - defense in depth
      # in front of the application-level checks in routes/word_import.py (MAX_UPLOAD_BYTES/
      # MAX_WORD_IMPORT_BATCH_BYTES etc.): rejects an oversized request body at the proxy
      # before it ever reaches a backend worker, and throttles repeated upload bursts from
      # a single (potentially compromised) writer account. Scoped to POST only so the
      # listing/detail GET endpoints under the same path prefix keep using the unthrottled
      # generic hocx-backend router.
      - "traefik.http.routers.hocx-word-import.rule=Host(`${TRAEFIK_DOMAIN}`) && PathPrefix(`/api/tools/word-import`) && Method(`POST`)"
      - "traefik.http.routers.hocx-word-import.entrypoints=websecure"
      - "traefik.http.routers.hocx-word-import.tls.certresolver=letsencrypt"
      - "traefik.http.routers.hocx-word-import.priority=200"
      - "traefik.http.routers.hocx-word-import.service=hocx-word-import"
      - "traefik.http.routers.hocx-word-import.middlewares=word-import-ratelimit,word-import-body-limit"
      - "traefik.http.services.hocx-word-import.loadbalancer.server.port=8000"
      - "traefik.http.middlewares.word-import-ratelimit.ratelimit.average=20"
      - "traefik.http.middlewares.word-import-ratelimit.ratelimit.burst=10"
      - "traefik.http.middlewares.word-import-ratelimit.ratelimit.period=1m"
      # 150 MB - matches MAX_WORD_IMPORT_BATCH_BYTES in routes/word_import.py
      - "traefik.http.middlewares.word-import-body-limit.buffering.maxRequestBodyBytes=157286400"

      # Galerie streamt direkt zum Backend (10 GiB + 1 MiB, dort begrenzt).
      # Kein Traefik-Buffer: sonst läge jedes ZIP doppelt auf Platte.
      - "traefik.http.routers.hocx-gallery-upload.rule=Host(`${TRAEFIK_DOMAIN}`) && Path(`/api/files/gallery-uploads`) && Method(`POST`)"
      - "traefik.http.routers.hocx-gallery-upload.entrypoints=websecure"
      - "traefik.http.routers.hocx-gallery-upload.tls.certresolver=letsencrypt"
      - "traefik.http.routers.hocx-gallery-upload.priority=200"
      - "traefik.http.routers.hocx-gallery-upload.service=hocx-gallery-upload"
      - "traefik.http.routers.hocx-gallery-upload.middlewares=gallery-upload-inflight"
      - "traefik.http.services.hocx-gallery-upload.loadbalancer.server.port=8000"
      - "traefik.http.middlewares.gallery-upload-inflight.inflightreq.amount=2"

  # Photo-culling Phase 3: scores face quality for photo_analysis_job batches. Its own
  # container/resource budget rather than living inside `backend` - see
  # photo-analysis-worker/README.md for why (OpenCV/ONNX inference is meaningfully
  # heavier per-request than anything else backend does, on a host that's already tight
  # on headroom - see docker-compose.release.yml's backend mem_limit history).
  photo-analysis-worker:
    build:
      context: ./photo-analysis-worker
    restart: unless-stopped
    mem_limit: 1280m
    cpus: 1.5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    env_file:
      - path: .env
        required: false
    environment:
      PHOTO_WORKER_DATABASE_URL: ${PHOTO_WORKER_DATABASE_URL}
      STORAGE_ROOT: /app/storage
      ABGABEBOX_STORAGE_ROOT: /app/storage/abgabebox-uploads
      STORAGE_CREDENTIALS_KEY: ${STORAGE_CREDENTIALS_KEY:-}
    networks:
      - default
      - storage
    depends_on:
      # Waits for the real healthcheck, not just "container started" - backend's `command`
      # runs `alembic upgrade head` before uvicorn, so healthy here means the
      # photo_analysis_job/stored_file.face_quality_score schema already exists.
      backend:
        condition: service_healthy
    volumes:
      # Only the code subdirectory, not all of /app - mounting the whole thing would shadow
      # /app/models/face_detection_yunet.onnx, which only exists baked into the built image
      # (see the Dockerfile), not in the source tree.
      - ./photo-analysis-worker/app:/app/app
      # Read-only: this worker only ever needs to read the original upload bytes, never
      # write to them.
      - ${HOCX_STORAGE_PATH:-./storage}:/app/storage:ro

  frontend:
    build:
      context: ./frontend
      target: deps
    restart: unless-stopped
    # 512m reichte fuer den "next build"-TypeScript-Check nicht (Cgroup-OOM-Kill,
    # Restart-Loop, verifiziert beim Deploy vom 2026-08-13). 1536m als Ceiling, analog
    # zum bereits akzeptierten Wert bei clamav.
    mem_limit: 1536m
    cpus: 1.0
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    env_file:
      - path: .env
        required: false
    environment:
      # Steuerbar fuer eine Instanz mit Echtdaten aus diesem Stack (Audit MAIN-OPS-009): dort
      # HOCX_ENVIRONMENT=production in .env setzen, sonst sind /docs und /openapi.json offen und
      # die Produktionssperren aus. docker-compose.dev.yml pinnt development.
      HOCX_ENVIRONMENT: ${HOCX_ENVIRONMENT:-development}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
      INTERNAL_API_URL: ${INTERNAL_API_URL}
      # See the backend service's comment above on why this needs to be explicit: without
      # it, frontend/lib/api/server.ts's cross-domain auth bridge check would silently use
      # this host's real dev .env value (TRAEFIK_DOMAIN=localhost) instead of whatever
      # --env-file actually intended (e2e sets it to "" to disable the bridge entirely).
      TRAEFIK_DOMAIN: ${TRAEFIK_DOMAIN}
      TRAEFIK_ADMIN_DOMAIN: ${TRAEFIK_ADMIN_DOMAIN}
      TRAEFIK_WEBSITE_DOMAIN: ${TRAEFIK_WEBSITE_DOMAIN:-}
      WEBSITE_CONTACT_EMAIL: ${WEBSITE_CONTACT_EMAIL:-}
      HOCX_APP_URL: ${HOCX_APP_URL:-}
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
      - ./.git:/app/.git:ro
    command: sh -c "export HOCX_VERSION=dev-$(git -C /app rev-parse --short HEAD 2>/dev/null || echo unknown) && npm run build && rm -rf .next/standalone/public .next/standalone/.next/static .next/standalone/messages && cp -r public .next/standalone/public && cp -r .next/static .next/standalone/.next/static && cp -r messages .next/standalone/messages && HOSTNAME=0.0.0.0 PORT=3000 node .next/standalone/server.js"
    healthcheck:
      # "/" liefert bei fehlender Session ein 307 nach /login statt eines 200 - curl -f
      # akzeptiert das (nur >=400 gilt als Fehler), reicht als reiner Liveness-Check.
      test: ["CMD", "curl", "-f", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      # Grosszuegig, da der dev-Start hier "npm run build" im Vordergrund vor dem
      # eigentlichen Server-Start ausfuehrt (siehe command oben).
      start_period: 120s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.hocx-frontend.rule=Host(`${TRAEFIK_DOMAIN}`) && !PathPrefix(`/admin`)"
      - "traefik.http.middlewares.web-inflight.inflightreq.amount=200"
      - "traefik.http.middlewares.web-inflight.inflightreq.sourcecriterion.ipstrategy.depth=0"
      - "traefik.http.routers.hocx-frontend.middlewares=web-inflight"
      - "traefik.http.routers.hocx-frontend.entrypoints=websecure"
      - "traefik.http.routers.hocx-frontend.tls.certresolver=letsencrypt"
      - "traefik.http.routers.hocx-frontend.priority=10"
      - "traefik.http.services.hocx-frontend.loadbalancer.server.port=3000"
      # Admin-UI inklusive /_next-Assets auf der privaten Admin-Domain. Der
      # EntryPoint selbst ist auf dem Host nur via 127.0.0.1 erreichbar.
      - "traefik.http.routers.hocx-admin-frontend.rule=Host(`${TRAEFIK_ADMIN_DOMAIN}`)"
      - "traefik.http.routers.hocx-admin-frontend.entrypoints=adminsecure"
      - "traefik.http.routers.hocx-admin-frontend.tls.certresolver=letsencryptdns"
      - "traefik.http.routers.hocx-admin-frontend.priority=10"
      - "traefik.http.routers.hocx-admin-frontend.service=hocx-frontend"
      # Oeffentliche Website (Landing Page) auf der Hauptdomain - proxy.ts schreibt dort jeden
      # Pfad auf /website um. Ohne TRAEFIK_WEBSITE_DOMAIN greift der Platzhalter nie, und der
      # Cert-Resolver bleibt leer - sonst versucht Traefik ein ACME-Zertifikat fuer
      # website.invalid zu holen und loggt bei jedem Start einen Fehler.
      - "traefik.http.routers.hocx-website-frontend.rule=Host(`${TRAEFIK_WEBSITE_DOMAIN:-website.invalid}`)"
      - "traefik.http.routers.hocx-website-frontend.middlewares=web-inflight"
      - "traefik.http.routers.hocx-website-frontend.entrypoints=websecure"
      - "traefik.http.routers.hocx-website-frontend.tls.certresolver=${TRAEFIK_WEBSITE_DOMAIN:+letsencrypt}"
      - "traefik.http.routers.hocx-website-frontend.priority=10"
      - "traefik.http.routers.hocx-website-frontend.service=hocx-frontend"

  # Oeffentliche Abgabebox (kein Login) auf eigener Subdomain, eigener Codebase,
  # eigene restricted DB-Rolle (siehe backend/alembic/versions/0020_abgabebox.py).
  abgabebox-backend:
    build:
      context: ./abgabebox-backend
    restart: unless-stopped
    mem_limit: 384m
    cpus: 1.0
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    env_file:
      - path: .env
        required: false
    environment:
      ABGABEBOX_DATABASE_URL: ${ABGABEBOX_DATABASE_URL}
      ABGABEBOX_STORAGE_ROOT: /app/storage
      ABGABEBOX_CORS_ORIGIN: https://${TRAEFIK_ABGABEBOX_DOMAIN}
      FRIENDLY_CAPTCHA_SITEKEY: ${FRIENDLY_CAPTCHA_SITEKEY}
      FRIENDLY_CAPTCHA_API_KEY: ${FRIENDLY_CAPTCHA_API_KEY}
      ABGABEBOX_CAPTCHA_SESSION_SECRET: ${ABGABEBOX_CAPTCHA_SESSION_SECRET}
      CLAMAV_HOST: clamav
      STORAGE_CREDENTIALS_KEY: ${STORAGE_CREDENTIALS_KEY:-}
    networks:
      - default
      - storage
    depends_on:
      db:
        condition: service_healthy
      backend:
        condition: service_started
    volumes:
      - ./abgabebox-backend:/app
      - ${HOCX_STORAGE_PATH:-./storage}/abgabebox-uploads:/app/storage
    command: sh -c "uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2"
    healthcheck:
      # Kein curl im python:3.13-slim-Image (siehe Audit), analog zum Haupt-Backend oben.
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.abgabebox-backend.rule=Host(`${TRAEFIK_ABGABEBOX_DOMAIN}`) && PathPrefix(`/api`)"
      - "traefik.http.routers.abgabebox-backend.middlewares=api-inflight"
      - "traefik.http.routers.abgabebox-backend.entrypoints=websecure"
      - "traefik.http.routers.abgabebox-backend.tls.certresolver=letsencrypt"
      - "traefik.http.routers.abgabebox-backend.priority=100"
      - "traefik.http.routers.abgabebox-backend.service=hocx-abgabebox-backend"
      - "traefik.http.services.hocx-abgabebox-backend.loadbalancer.server.port=8000"
      # Dedizierter Router nur fuer den Upload-POST, mit Rate-Limit gegen Spam/DoS
      # (analog auth-ratelimit) - da dieser Endpoint komplett unauthentifiziert ist.
      # H11 (2026-08-12 Audit): zusaetzlich ein Body-Limit, analog word-import-body-limit
      # oben beim Haupt-Backend - `content = await upload_file.read()` in
      # abgabebox-backend/app/routes/public.py liest den kompletten Body, bevor irgendeine
      # Groessenpruefung greift, und Starlette puffert den kompletten Body ohnehin schon vorher
      # auf Platte, unabhaengig von jeder nachgelagerten Anwendungslogik-Pruefung - dieses
      # Traefik-Limit weist ueberdimensionierte Requests VOR dem Backend-Worker ab. Deckt sich
      # mit dem im Worst-Case durch die Assignment-eigenen Grenzen (max_files_per_element<=20,
      # max_file_size_mb<=100, siehe backend/app/schemas/submission.py) legitim moeglichen
      # Gesamtvolumen und mit MAX_UPLOAD_REQUEST_BYTES in
      # abgabebox-backend/app/routes/public.py - bei Aenderung dort synchron halten.
      - "traefik.http.routers.abgabebox-upload.rule=Host(`${TRAEFIK_ABGABEBOX_DOMAIN}`) && PathPrefix(`/api/public`) && Method(`POST`)"
      - "traefik.http.routers.abgabebox-upload.entrypoints=websecure"
      - "traefik.http.routers.abgabebox-upload.tls.certresolver=letsencrypt"
      - "traefik.http.routers.abgabebox-upload.priority=200"
      - "traefik.http.routers.abgabebox-upload.service=hocx-abgabebox-backend"
      - "traefik.http.routers.abgabebox-upload.middlewares=abgabebox-upload-ratelimit,abgabebox-upload-inflight,abgabebox-upload-body-limit"
      - "traefik.http.middlewares.abgabebox-upload-ratelimit.ratelimit.average=30"
      - "traefik.http.middlewares.abgabebox-upload-ratelimit.ratelimit.burst=10"
      - "traefik.http.middlewares.abgabebox-upload-ratelimit.ratelimit.period=1m"
      # Lowered from 2000 MB (audit finding, 2026-08-25) - that figure was the worst-case
      # legitimate total per the assignment's own max_file_size_mb/max_files_per_element
      # settings, but routes/public.py's upload() holds every file's full content in memory
      # at once (dedup/perceptual-hash/quarantine steps), and this container only has 384m
      # (mem_limit above) across 2 workers - a request anywhere near 2000 MB reliably OOM-
      # kills the whole service for every tenant. Keep in sync with
      # abgabebox-backend/app/routes/public.py's MAX_UPLOAD_REQUEST_BYTES.
      - "traefik.http.middlewares.abgabebox-upload-body-limit.buffering.maxRequestBodyBytes=158334976"
      - "traefik.http.middlewares.abgabebox-upload-inflight.inflightreq.amount=2"
      # Dedizierter Router fuer die oeffentlichen, unauthentifizierten GET-Endpunkte
      # (assignments/elements listing+detail) - ohne dieses Limit liessen sich Mandanten-
      # Slugs, Auftraege und Elemente unbegrenzt durchprobieren/enumerieren. Grosszuegiger
      # als der Upload-Limit, da normales Blaettern/Neuladen der Abgabebox-Seite mehrere
      # GETs pro Sekunde ausloesen kann.
      - "traefik.http.routers.abgabebox-public-get.rule=Host(`${TRAEFIK_ABGABEBOX_DOMAIN}`) && PathPrefix(`/api/public`) && Method(`GET`)"
      - "traefik.http.routers.abgabebox-public-get.entrypoints=websecure"
      - "traefik.http.routers.abgabebox-public-get.tls.certresolver=letsencrypt"
      - "traefik.http.routers.abgabebox-public-get.priority=200"
      - "traefik.http.routers.abgabebox-public-get.service=hocx-abgabebox-backend"
      - "traefik.http.routers.abgabebox-public-get.middlewares=abgabebox-public-ratelimit,api-inflight"
      # Gleicher Wert wie docker-compose.release.yml (Audit MAIN-OPS-014).
      - "traefik.http.middlewares.abgabebox-public-ratelimit.ratelimit.average=60"
      - "traefik.http.middlewares.abgabebox-public-ratelimit.ratelimit.burst=20"
      - "traefik.http.middlewares.abgabebox-public-ratelimit.ratelimit.period=1m"
      # Echtheitsprüfung (POST /api/public/verify): eigener Router VOR dem Upload-Router (der
      # matcht sonst jeden POST unter /api/public mit 151-MiB-Body und In-Flight 2). Der Body ist
      # nur ein Hash plus optionaler Dokument-ID - 4 KiB reichen weit.
      - "traefik.http.routers.abgabebox-verify.rule=Host(`${TRAEFIK_ABGABEBOX_DOMAIN}`) && Path(`/api/public/verify`) && Method(`POST`)"
      - "traefik.http.routers.abgabebox-verify.entrypoints=websecure"
      - "traefik.http.routers.abgabebox-verify.tls.certresolver=letsencrypt"
      - "traefik.http.routers.abgabebox-verify.priority=300"
      - "traefik.http.routers.abgabebox-verify.service=hocx-abgabebox-backend"
      - "traefik.http.routers.abgabebox-verify.middlewares=abgabebox-verify-ratelimit,abgabebox-verify-body-limit"
      - "traefik.http.middlewares.abgabebox-verify-ratelimit.ratelimit.average=30"
      - "traefik.http.middlewares.abgabebox-verify-ratelimit.ratelimit.burst=10"
      - "traefik.http.middlewares.abgabebox-verify-ratelimit.ratelimit.period=1m"
      - "traefik.http.middlewares.abgabebox-verify-body-limit.buffering.maxRequestBodyBytes=4096"

  # Lokales S3 (Garage, docs-site/docs/technik/storage/lokales-s3.md). Beim ersten Deployment automatisch
  # bereitgestellt; nur im internen Netz "storage" erreichbar, keine veröffentlichten Ports.
  # Ob der Container laufen muss, entscheidet scripts/storage_controller.sh auf dem Host -
  # gestoppt wird nur, nie gelöscht (Volume local_s3_data bleibt).
  local-s3:
    image: dxflrs/garage:v2.3.0@sha256:866bd13ed2038ba7e7190e840482bc27234c4afaf77be8cfa439ae088c1e4690
    restart: unless-stopped
    mem_limit: 512m
    cpus: 1.0
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET:-}
      GARAGE_ADMIN_TOKEN: ${GARAGE_ADMIN_TOKEN:-}
    volumes:
      - ./infra/garage/garage.toml:/etc/garage.toml:ro
      - local_s3_data:/var/lib/garage
    networks:
      - storage
    healthcheck:
      test: ["CMD", "/garage", "status"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Richtet Layout, Schlüssel und Buckets idempotent ein (infra/garage/bootstrap.py) und beendet sich.
  storage-init:
    build:
      context: ./backend
    restart: "no"
    environment:
      GARAGE_ADMIN_URL: http://local-s3:3903
      GARAGE_ADMIN_TOKEN: ${GARAGE_ADMIN_TOKEN:-}
      LOCAL_S3_BUCKET: hocx-main
      LOCAL_S3_ABGABEBOX_BUCKET: hocx-abgabebox
      LOCAL_S3_ACCESS_KEY: ${LOCAL_S3_ACCESS_KEY:-}
      LOCAL_S3_SECRET_KEY: ${LOCAL_S3_SECRET_KEY:-}
      LOCAL_S3_ABGABEBOX_ACCESS_KEY: ${LOCAL_S3_ABGABEBOX_ACCESS_KEY:-}
      LOCAL_S3_ABGABEBOX_SECRET_KEY: ${LOCAL_S3_ABGABEBOX_SECRET_KEY:-}
    volumes:
      - ./infra/garage/bootstrap.py:/bootstrap/bootstrap.py:ro
    command: ["python3", "/bootstrap/bootstrap.py"]
    networks:
      - storage
    depends_on:
      local-s3:
        condition: service_healthy

  # Storage-Migrations-Worker (app/workers/storage_worker.py): gleicher Code wie das Backend,
  # eigener Prozess mit eigenem Ressourcenbudget. Mehrere Instanzen sind sicher (Lease/Fencing).
  storage-worker:
    build:
      context: ./backend
    user: "0:0"
    restart: unless-stopped
    mem_limit: 1024m
    cpus: 1.0
    env_file:
      - path: .env
        required: false
    environment:
      HOCX_ENVIRONMENT: development
      DATABASE_URL: ${DATABASE_URL}
      APP_DATABASE_URL: ${APP_DATABASE_URL}
      AUTH_SECRET: ${AUTH_SECRET}
      ADMIN_AUTH_SECRET: ${ADMIN_AUTH_SECRET}
      PYTHONPATH: /app
      STORAGE_ROOT: /app/storage
      EXPORT_ROOT: /app/storage/exports
      UPLOAD_ROOT: /app/storage/uploads
      ABGABEBOX_STORAGE_ROOT: /app/abgabebox-storage
      STORAGE_CREDENTIALS_KEY: ${STORAGE_CREDENTIALS_KEY:-}
      STORAGE_WORK_ROOT: /app/storage-local/work
    command: ["python", "-m", "app.workers.storage_worker"]
    volumes:
      - ./backend:/app
      - ${HOCX_STORAGE_PATH:-./storage}:/app/storage
      - ${HOCX_STORAGE_PATH:-./storage}/abgabebox-uploads:/app/abgabebox-storage
      - ./storage-local/work:/app/storage-local/work
      # Ziel von scripts/backup_storage.sh (Objekt-Backup, siehe docs technik/storage/backup.md)
      - ./backups/storage:/app/backups/storage
    networks:
      - default
      - storage
    depends_on:
      backend:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Backup-Worker (docs-site/docs/technik/backup/). Im Dev-Stack nur mit Profil "backup":
  #   docker compose --profile backup up -d backup-worker
  # Repository z. B. lokal: BACKUP_REPOSITORY_URL=/backup-work/dev-repo, BACKUP_PASSPHRASE_FILE in .env.
  backup-worker:
    build:
      context: ./backend
    user: "0:0"
    restart: unless-stopped
    mem_limit: 1536m
    cpus: 1.0
    env_file:
      - path: .env
        required: false
    environment:
      HOCX_ENVIRONMENT: development
      DATABASE_URL: ${DATABASE_URL}
      AUTH_SECRET: ${AUTH_SECRET}
      ADMIN_AUTH_SECRET: ${ADMIN_AUTH_SECRET}
      PYTHONPATH: /app
      STORAGE_ROOT: /app/storage
      EXPORT_ROOT: /app/storage/exports
      UPLOAD_ROOT: /app/storage/uploads
      ABGABEBOX_STORAGE_ROOT: /app/abgabebox-storage
      STORAGE_CREDENTIALS_KEY: ${STORAGE_CREDENTIALS_KEY:-}
      STORAGE_WORK_ROOT: /app/storage-local/work
      REDIS_URL: redis://redis:6379/0
      BACKUP_WORK_DIR: /backup-work
    command: ["python", "-m", "app.workers.backup_worker"]
    volumes:
      - ./backend:/app
      - ${HOCX_STORAGE_PATH:-./storage}:/app/storage
      - ${HOCX_STORAGE_PATH:-./storage}/abgabebox-uploads:/app/abgabebox-storage
      - ./storage-local/work:/app/storage-local/work
      - ./backups/borg-work:/backup-work
    networks:
      - default
      - storage
    depends_on:
      backend:
        condition: service_healthy
    profiles: [backup]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  clamav:
    image: clamav/clamav@sha256:9cb27d7660bdf66e9878c832cb433dd8aa152cfbe16f3c2c0084c80b04ae22b4
    restart: unless-stopped
    # Das Image prueft per Default nur 1x taeglich auf neue Signaturen. Verpasst clamd beim
    # Containerstart die Reload-Benachrichtigung (Socket noch nicht bereit), bliebe es sonst
    # bis zum naechsten Tag auf dem alten Stand - mit 12 Checks spaetestens nach 2 Stunden.
    environment:
      FRESHCLAM_CHECKS: "12"
    # Grosszuegiger als die anderen Services - die Signaturdatenbank allein braucht schon
    # mehrere hundert MB im Speicher, ein zu enges Limit fuehrt zu Crash-Loops statt Schutz.
    mem_limit: 1536m
    cpus: 1.0
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - clamav_db:/var/lib/clamav
      - ./infra/clamav/clamd.conf:/etc/clamav/clamd.conf:ro
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 60s
      timeout: 30s
      start_period: 300s
      retries: 5

  abgabebox-frontend:
    build:
      context: ./abgabebox-frontend
      target: deps
    restart: unless-stopped
    # 384m had the exact same OOM-restart-loop risk as frontend before its fix
    # (verified 2026-08-13 deploy) - this service builds Next.js at container startup too
    # (target: deps, `npm run build` in command: below), so it hits the same TypeScript-
    # check memory peak. Raised to the same 1536m ceiling (audit I2, 2026-08-16) - never
    # actually verified against a real rebuild here yet, see the frontend comment's
    # warning about that.
    mem_limit: 1536m
    cpus: 0.5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    env_file:
      - path: .env
        required: false
    environment:
      NEXT_PUBLIC_ABGABEBOX_API_URL: https://${TRAEFIK_ABGABEBOX_DOMAIN}
      # Nicht direkt auf den Container (siehe INTERNAL_API_URL im Haupt-hocX-Frontend fuer die
      # ausfuehrliche Begruendung: uvicorn liefert unter echter Nebenlaeufigkeit bei direkten,
      # neuen Verbindungen nachweislich gelegentlich die falsche Antwort - reproduzierbar mit
      # parallelen Requests, nie ueber Traefik). Live am 2026-07-27 auch fuer die Abgabebox
      # reproduziert (8 von 20 parallelen Requests gegen /api/public/.../assignments kamen mit
      # falschem 404 zurueck) - hier war der Fix von damals nie nachgezogen worden.
      INTERNAL_ABGABEBOX_API_URL: https://${TRAEFIK_ABGABEBOX_DOMAIN}
      NEXT_PUBLIC_FRIENDLY_CAPTCHA_SITEKEY: ${FRIENDLY_CAPTCHA_SITEKEY}
    depends_on:
      - abgabebox-backend
    volumes:
      - ./abgabebox-frontend:/app
      - /app/node_modules
      - /app/.next
    command: sh -c "npm run build && rm -rf .next/standalone/public .next/standalone/.next/static .next/standalone/messages && cp -r public .next/standalone/public && cp -r .next/static .next/standalone/.next/static && cp -r messages .next/standalone/messages && HOSTNAME=0.0.0.0 PORT=3000 node .next/standalone/server.js"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      # Grosszuegig, da der dev-Start hier "npm run build" im Vordergrund vor dem
      # eigentlichen Server-Start ausfuehrt (siehe command oben).
      start_period: 120s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.abgabebox-frontend.rule=Host(`${TRAEFIK_ABGABEBOX_DOMAIN}`)"
      - "traefik.http.routers.abgabebox-frontend.middlewares=web-inflight"
      - "traefik.http.routers.abgabebox-frontend.entrypoints=websecure"
      - "traefik.http.routers.abgabebox-frontend.tls.certresolver=letsencrypt"
      - "traefik.http.routers.abgabebox-frontend.priority=10"
      - "traefik.http.routers.abgabebox-frontend.service=hocx-abgabebox-frontend"
      - "traefik.http.services.hocx-abgabebox-frontend.loadbalancer.server.port=3000"

  # Software-Dokumentation (MkDocs Material), statischer Build hinter nginx.
  docs:
    build:
      context: ./docs-site
    restart: unless-stopped
    cap_add:
      - NET_BIND_SERVICE
    mem_limit: 128m
    cpus: 0.25
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.hocx-docs.rule=Host(`${TRAEFIK_DOCS_DOMAIN}`)"
      - "traefik.http.routers.hocx-docs.entrypoints=websecure"
      - "traefik.http.routers.hocx-docs.tls.certresolver=letsencrypt"
      - "traefik.http.routers.hocx-docs.priority=10"
      - "traefik.http.services.hocx-docs.loadbalancer.server.port=80"

networks:
  # Siehe docker-socket-proxy: internes Netz nur zwischen Backend und Proxy.
  docker-api:
    internal: true
  # Siehe redis: internes Netz nur zwischen Backend und Redis.
  cache:
    internal: true
  # Siehe traefik-socket-proxy: nur Traefik und sein Proxy.
  traefik-docker-api:
    internal: true
  # Objektspeicher: nur Backend, Worker, Abgabebox und Foto-Worker erreichen das lokale S3.
  storage:
    internal: true

volumes:
  postgres_data:
  clamav_db:
  local_s3_data:
