services:
  db:
    ports: !override
      - "127.0.0.1:55432:5432"
  backend:
    # Tests must not lose in-flight requests when source/test files change locally.
    # --timeout-keep-alive 75 wie produktiv (docker-compose.yml): der Next-Rewrite-Proxy des
    # Frontends hält Verbindungen offen und verwendet sie wieder; mit uvicorns Standard von 5 s
    # schloss das Backend sie vorher, und eine wiederverwendete Verbindung endete gelegentlich mit
    # «socket hang up (ECONNRESET)» mitten in einem E2E-Test.
    command: sh -c "alembic -x seed_demo=true upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --timeout-keep-alive 75"
    ports: !override
      - "127.0.0.1:18000:8000"
    environment:
      TRAEFIK_DOMAIN: ""
      TRAEFIK_ADMIN_DOMAIN: ""
      # The e2e stack publishes the frontend on host port 13000 (see below) while the
      # container itself still listens on 3000, so the browser's Origin header is
      # "http://127.0.0.1:13000" - not covered by main.py's/collaboration_ws.py's static
      # 3000-only allowlist. Without this, every protocol-collaboration WebSocket handshake
      # got rejected with 403 in this stack (surfaced in the UI as a permanent, unexplained
      # "Offline" label - usability-audit finding F3, 2026-10-01).
      EXTRA_CORS_ORIGINS: "http://127.0.0.1:13000"
      # Default is 15 minutes (app/core/config.py) - far too slow for
      # e2e/abgabebox-photo-album-sync.spec.ts to wait out. Shortened here only (never in
      # docker-compose.yml/.dev.yml) so the real photo_album_sync_loop still ticks and
      # folds a freshly-submitted Abgabebox photo into its Zyklus/Abgabe album within a
      # test's timeout, instead of adding a synchronous "run it now" endpoint that
      # wouldn't exist in production and wouldn't prove the actual background loop works.
      PHOTO_ALBUM_SYNC_INTERVAL_MINUTES: "1"
      # Wegwerf-Stack ohne externe Dienste (wie .env.e2e.example): env_file lädt nur die echte .env,
      # Werte aus --env-file kommen nur über ${...} an. Ohne das prüfte das Backend Passwörter
      # online (HIBP) - seit 1.5.2 auch bei jeder Anmeldung, und die Demo-Passwörter gelten dort
      # als geleakt (Mailcode nötig, im E2E-Stack kein Mailversand). Nur der E2E-Stack.
      PASSWORD_LEAK_CHECK: ${PASSWORD_LEAK_CHECK:-local-only}
      GEOIP_AUTO_UPDATE: ${GEOIP_AUTO_UPDATE:-false}
      # Datei-Import: nachgebaute Cloud-Anbieter (services/cloud_import/fake_*.py), nur dieser
      # Wegwerf-Stack. Token-Schlüssel erzeugt scripts/e2e.sh je Stack.
      CLOUD_IMPORT_FAKE_PROVIDERS: "true"
      CLOUD_IMPORT_REDIRECT_BASE_URL: http://127.0.0.1:13000
  job-worker:
    environment:
      # Datei-Import: nachgebaute Cloud-Anbieter (services/cloud_import/fake_*.py), nur dieser
      # Wegwerf-Stack. Token-Schlüssel erzeugt scripts/e2e.sh je Stack.
      CLOUD_IMPORT_FAKE_PROVIDERS: "true"
      CLOUD_IMPORT_REDIRECT_BASE_URL: http://127.0.0.1:13000
      PASSWORD_LEAK_CHECK: ${PASSWORD_LEAK_CHECK:-local-only}
      GEOIP_AUTO_UPDATE: ${GEOIP_AUTO_UPDATE:-false}
      # Der Album-Sync läuft seit dem Concurrency-Audit (Paket 10) im job-worker, nicht mehr im
      # Backend - das kurze Intervall für abgabebox-photo-album-sync.spec.ts gehört deshalb hierher.
      PHOTO_ALBUM_SYNC_INTERVAL_MINUTES: "1"
      # Duplikate/Ähnliche werden im Hintergrund gruppiert - im E2E-Stack nicht 2 Minuten warten.
      PHOTO_SIMILARITY_REFRESH_INTERVAL_MINUTES: "0.25"
      # Foto-Standorte: keine Downloads im E2E-Stack - scripts/e2e.sh lädt den kleinen Testdatensatz
      GEO_PLACES_AUTO_UPDATE: "false"
  frontend:
    ports: !override
      - "127.0.0.1:13000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://127.0.0.1:13000
      INTERNAL_API_URL: http://backend:8000
      FRONTEND_API_PROXY_TARGET: http://backend:8000
      HOCX_VERSION: e2e
  abgabebox-backend:
    # Wie das Backend oben: ohne --reload und mit Keep-Alive 75 s (Abgabebox-Frontend proxyt
    # /api über ABGABEBOX_API_PROXY_TARGET, sonst ECONNRESET bei wiederverwendeten Verbindungen).
    command: sh -c "uvicorn app.main:app --host 0.0.0.0 --port 8000 --timeout-keep-alive 75"
    ports: !override
      - "127.0.0.1:18001:8000"
    environment:
      ABGABEBOX_CORS_ORIGIN: http://127.0.0.1:13001
      # Coordination note, 2026-08-27: new setting from abgabebox-backend/app/config.py -
      # controls CAPTCHA fail-open (dev/test) vs fail-closed (default/production) behavior.
      # .env.e2e.example leaves FRIENDLY_CAPTCHA_SITEKEY/API_KEY empty, so this must be an
      # accepted dev/test value or every e2e upload gets rejected fail-closed.
      ABGABEBOX_ENVIRONMENT: test
  abgabebox-frontend:
    ports: !override
      - "127.0.0.1:13001:3000"
    environment:
      NEXT_PUBLIC_ABGABEBOX_API_URL: http://127.0.0.1:13001
      INTERNAL_ABGABEBOX_API_URL: http://abgabebox-backend:8000
      ABGABEBOX_API_PROXY_TARGET: http://abgabebox-backend:8000
  # docker-compose.dev.yml gates clamav behind the "scan" profile (opt-in - the signature DB
  # alone costs several hundred MB and clamd takes real time to become healthy), so it's
  # normally absent from local dev. e2e needs it on unconditionally: without a reachable
  # clamd, every upload's scan_status stays "pending" forever (see app/scanner.py) and
  # photo_album_sync_loop's `StoredFile.scan_status == "clean"` filter never matches
  # anything - e2e/abgabebox-photo-album-sync.spec.ts's whole chain depends on a real scan
  # actually completing. Clearing the profile here (not in docker-compose.dev.yml) keeps
  # local dev's opt-in default untouched.
  clamav:
    profiles: !override []
    # Frisches Volume: freshclam lädt beim Start eine neue Tagesdatenbank, während clamd die alte
    # lädt - zwei Datenbanken im Speicher sprengten das Limit von 1,5 GB (clamd OOM-gekillt, Socket
    # nie da; scripts/e2e.sh wartet dann vergeblich auf ClamAV). Nur im Wegwerf-Stack mehr Luft.
    mem_limit: 3g
