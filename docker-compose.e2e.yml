services:
  db:
    ports: !override
      - "127.0.0.1:55432:5432"
  backend:
    # Tests must not lose in-flight requests when source/test files change locally.
    command: sh -c "alembic -x seed_demo=true upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    ports: !override
      - "127.0.0.1:18000:8000"
    environment:
      TRAEFIK_DOMAIN: ""
      # Default is 15 minutes (app/core/config.py) - far too slow for
      # e2e/abgabebox-photo-album-sync.spec.ts to wait out. Shortened here only (never in
      # docker-compose.yml/.dev.yml) so the real photo_album_sync_loop still ticks and
      # folds a freshly-submitted Abgabebox photo into its Zyklus/Abgabe album within a
      # test's timeout, instead of adding a synchronous "run it now" endpoint that
      # wouldn't exist in production and wouldn't prove the actual background loop works.
      PHOTO_ALBUM_SYNC_INTERVAL_MINUTES: "1"
  frontend:
    ports: !override
      - "127.0.0.1:13000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://127.0.0.1:13000
      INTERNAL_API_URL: http://backend:8000
      FRONTEND_API_PROXY_TARGET: http://backend:8000
      HOCX_VERSION: e2e
  abgabebox-backend:
    ports: !override
      - "127.0.0.1:18001:8000"
    environment:
      ABGABEBOX_CORS_ORIGIN: http://127.0.0.1:13001
      # Coordination note, 2026-08-27: new setting from abgabebox-backend/app/config.py -
      # controls CAPTCHA fail-open (dev/test) vs fail-closed (default/production) behavior.
      # .env.e2e.example leaves FRIENDLY_CAPTCHA_SITEKEY/API_KEY empty, so this must be an
      # accepted dev/test value or every e2e upload gets rejected fail-closed.
      ABGABEBOX_ENVIRONMENT: test
  abgabebox-frontend:
    ports: !override
      - "127.0.0.1:13001:3000"
    environment:
      NEXT_PUBLIC_ABGABEBOX_API_URL: http://127.0.0.1:13001
      INTERNAL_ABGABEBOX_API_URL: http://abgabebox-backend:8000
      ABGABEBOX_API_PROXY_TARGET: http://abgabebox-backend:8000
  # docker-compose.dev.yml gates clamav behind the "scan" profile (opt-in - the signature DB
  # alone costs several hundred MB and clamd takes real time to become healthy), so it's
  # normally absent from local dev. e2e needs it on unconditionally: without a reachable
  # clamd, every upload's scan_status stays "pending" forever (see app/scanner.py) and
  # photo_album_sync_loop's `StoredFile.scan_status == "clean"` filter never matches
  # anything - e2e/abgabebox-photo-album-sync.spec.ts's whole chain depends on a real scan
  # actually completing. Clearing the profile here (not in docker-compose.dev.yml) keeps
  # local dev's opt-in default untouched.
  clamav:
    profiles: !override []
