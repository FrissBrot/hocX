services:
  traefik:
    # v3.1 hardcoded Docker API version 1.24 when talking to the docker socket - broke
    # entirely against Docker Engine >= 29 (minimum supported API raised to 1.40+):
    # "client version 1.24 is too old", provider never loads any router config, Traefik
    # falls back to its self-signed default cert for every host. v3.6.1 replaced the
    # hardcoded version with real negotiation against the daemon (traefik/traefik#12256).
    image: traefik:v3.6.1
    restart: unless-stopped
    # Audit finding, 2026-08-27: this file had NONE of the hardening docker-compose.yml
    # (dev) already applies to its own (profile-gated, non-internet-facing) traefik service -
    # the actual prod Traefik, exposed directly to the internet on 80/443, ran with no
    # memory/cpu ceiling and no container-hardening flags at all, because deploy.sh/
    # verify_release.sh never include the base docker-compose.yml in their stack. mem_limit/
    # cpus mirror docker-compose.yml's equivalent (M28, Audit 2026-08-12) - Traefik itself is
    # lightweight, this is a ceiling against a runaway container, not a normal-operation target.
    # Raised 2026-09-02 for margin (all public traffic passes through this one container)
    # alongside the other services now that the host has 16GB/8 cores.
    mem_limit: 256m
    cpus: 1.0
    init: true
    read_only: true
    cap_drop:
      - ALL
    # Needed to bind entrypoints 80/443/8443 (<1024) - the image runs as root by default
    # (no USER in its Dockerfile) but with all capabilities dropped even root cannot bind
    # privileged ports without this. Reading /var/run/docker.sock still works: the socket
    # is root-owned and this container's effective UID is 0, so the owner permission bits
    # apply without needing CAP_DAC_OVERRIDE.
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    # infra/traefik/dynamic gehoert hocx-deploy:5001 (deploy.sh's
    # prepare_runtime_permissions haertet es auf g+rwX,o-rwx, damit backend als
    # UID 5000/GID 5001 dort hineinschreiben kann - siehe TRAEFIK_DYNAMIC_CONFIG_DIR
    # in docker-compose.release.yml). Traefik selbst laeuft als root, aber ohne
    # CAP_DAC_OVERRIDE (cap_drop:ALL) greifen fuer root dieselben Rechte wie fuer
    # jeden anderen - ohne diese Zusatzgruppe waere das Verzeichnis fuer den
    # file.Provider unlesbar ("permission denied").
    group_add:
      - "5001"
    # The official image declares `/tmp` as a VOLUME (see traefik/traefik's Dockerfile) - the
    # buffering middleware (maxRequestBodyBytes, used for tenant-import/word-import/abgabebox-
    # upload elsewhere in this repo) spools any request body over 1 MiB to a temp file there
    # by default, and those routes allow bodies up to ~2 GiB. A tmpfs (RAM-backed) mount here
    # would count against mem_limit above and get OOM-killed on a large legitimate upload, so
    # this uses a real (disk-backed) named volume instead - the ACME storage files under
    # /letsencrypt are already writable via the existing bind mount below and need no change.
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./infra/traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./infra/traefik/letsencrypt:/letsencrypt
      - ./infra/traefik/dynamic:/etc/traefik/dynamic:ro
      - traefik_tmp:/tmp
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      - frontend
      - backend
    environment:
      TRAEFIK_CERTIFICATESRESOLVERS_LETSENCRYPT_ACME_EMAIL: ${ACME_EMAIL}
      TRAEFIK_CERTIFICATESRESOLVERS_LETSENCRYPTDNS_ACME_EMAIL: ${ACME_EMAIL}
      CF_DNS_API_TOKEN_FILE: /run/secrets/cf_dns_api_token
    secrets:
      - cf_dns_api_token
    ports:
      # Default 0.0.0.0 = oeffentlich erreichbar (Prod-Verhalten, unveraendert). Auf
      # Hosts, die wie der Admin-Zugang rein privat ueber OpenZiti laufen sollen,
      # TRAEFIK_WEB_BIND/TRAEFIK_WEBSECURE_BIND=127.0.0.1 in .env setzen - dann muss
      # TRAEFIK_CERTRESOLVER (siehe docker-compose.release.yml) ebenfalls auf
      # letsencryptdns stehen, da die HTTP-01-Challenge auf einem privaten Port nicht
      # funktioniert.
      - "${TRAEFIK_WEB_BIND:-0.0.0.0}:80:80"
      - "${TRAEFIK_WEBSECURE_BIND:-0.0.0.0}:443:443"
      # OpenZiti terminiert den privaten Admin-Service auf diesem Loopback-Port.
      - "127.0.0.1:${TRAEFIK_ADMIN_PORT:-8443}:8443"
    command:
      - --configFile=/etc/traefik/traefik.yml

volumes:
  traefik_tmp:

secrets:
  # file: statt environment: - siehe docker-compose.release.yml fuer die Begruendung
  # (Compose v5.5.0 lehnt environment-Secrets auf read_only-Services ab).
  cf_dns_api_token:
    file: ${HOCX_SECRETS_DIR:-./.secrets}/cf_dns_api_token
