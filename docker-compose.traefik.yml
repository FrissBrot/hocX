services:
  # Traefik liest die Docker-API nur über diesen Proxy (Audit MAIN-OPS-004): der rohe Socket ist
  # root-äquivalent, Traefik hängt am Internet. Erlaubt sind nur GET auf Container, Events,
  # Ping und Version - genau das, was der Docker-Provider braucht (live geprüft 2026-10-16:
  # Router, später gestartete Container über Events; POST, /info, /secrets, exec -> 403).
  traefik-socket-proxy:
    image: lscr.io/linuxserver/socket-proxy:3.4.6-r0-ls101@sha256:362cadf55b3c7920189347d0f4d60b389e2f80e929581bf10793f2371aab41e5
    restart: unless-stopped
    mem_limit: 64m
    cpus: 0.25
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /run
    environment:
      CONTAINERS: 1
      EVENTS: 1
      PING: 1
      VERSION: 1
      POST: 0
      LOG_LEVEL: warning
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - traefik-docker-api
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  traefik:
    # v3.1 hardcoded Docker API version 1.24 when talking to the docker socket - broke
    # entirely against Docker Engine >= 29 (minimum supported API raised to 1.40+):
    # "client version 1.24 is too old", provider never loads any router config, Traefik
    # falls back to its self-signed default cert for every host. v3.6.1 replaced the
    # hardcoded version with real negotiation against the daemon (traefik/traefik#12256).
    image: traefik:v3.7.19@sha256:a6c0194dda77bcb804824580f36fa7edc56e315b1acfe933366c8b52844a78a4
    restart: unless-stopped
    # Audit finding, 2026-08-27: this file had NONE of the hardening docker-compose.yml
    # (dev) already applies to its own (profile-gated, non-internet-facing) traefik service -
    # the actual prod Traefik, exposed directly to the internet on 80/443, ran with no
    # memory/cpu ceiling and no container-hardening flags at all, because deploy.sh/
    # verify_release.sh never include the base docker-compose.yml in their stack. mem_limit/
    # cpus mirror docker-compose.yml's equivalent (M28, Audit 2026-08-12) - Traefik itself is
    # lightweight, this is a ceiling against a runaway container, not a normal-operation target.
    # Raised 2026-09-02 for margin (all public traffic passes through this one container)
    # alongside the other services now that the host has 16GB/8 cores.
    mem_limit: 256m
    cpus: 1.0
    init: true
    read_only: true
    cap_drop:
      - ALL
    # Needed to bind entrypoints 80/443/8443 (<1024) - the image runs as root by default
    # (no USER in its Dockerfile) but with all capabilities dropped even root cannot bind
    # privileged ports without this. Die Docker-API erreicht Traefik nur über
    # traefik-socket-proxy (MAIN-OPS-004), nicht mehr über den gemounteten Socket.
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    # infra/traefik/dynamic gehoert hocx-deploy:5001 (deploy.sh:
    # prepare_thumbnail_dir haertet es auf g+rwX,o-rwx, damit backend als
    # UID 5000/GID 5001 dort hineinschreiben kann - siehe TRAEFIK_DYNAMIC_CONFIG_DIR
    # in docker-compose.release.yml). Traefik selbst laeuft als root, aber ohne
    # CAP_DAC_OVERRIDE (cap_drop:ALL) greifen fuer root dieselben Rechte wie fuer
    # jeden anderen - ohne diese Zusatzgruppe waere das Verzeichnis fuer den
    # file.Provider unlesbar ("permission denied").
    group_add:
      - "5001"
    # The official image declares `/tmp` as a VOLUME (see traefik/traefik's Dockerfile) - the
    # buffering middleware (maxRequestBodyBytes, used for tenant-import/word-import/abgabebox-
    # upload elsewhere in this repo) spools any request body over 1 MiB to a temp file there
    # by default, and those routes allow bodies up to ~2 GiB. A tmpfs (RAM-backed) mount here
    # would count against mem_limit above and get OOM-killed on a large legitimate upload, so
    # this uses a real (disk-backed) named volume instead - the ACME storage files under
    # /letsencrypt are already writable via the existing bind mount below and need no change.
    volumes:
      - ./infra/traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./infra/traefik/letsencrypt:/letsencrypt
      - ./infra/traefik/dynamic:/etc/traefik/dynamic:ro
      - traefik_tmp:/tmp
    # Review M1: nur im Netz edge (mit den Diensten, die Traefik anspricht) und im Proxy-Netz -
    # nicht im Standardnetz von Datenbank und Workern.
    networks:
      - edge
      - traefik-docker-api
      # Wartungsseite (maintenance-page), siehe unten.
      - maintenance
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      - frontend
      - backend
      - traefik-socket-proxy
    environment:
      TRAEFIK_CERTIFICATESRESOLVERS_LETSENCRYPT_ACME_EMAIL: ${ACME_EMAIL}
      TRAEFIK_CERTIFICATESRESOLVERS_LETSENCRYPTDNS_ACME_EMAIL: ${ACME_EMAIL}
      CF_DNS_API_TOKEN_FILE: /run/secrets/cf_dns_api_token
    secrets:
      - cf_dns_api_token
    ports:
      # Default 0.0.0.0 = oeffentlich erreichbar (Prod-Verhalten, unveraendert). Auf
      # Hosts, die wie der Admin-Zugang rein privat ueber OpenZiti laufen sollen,
      # TRAEFIK_WEB_BIND/TRAEFIK_WEBSECURE_BIND=127.0.0.1 in .env setzen - dann muss
      # TRAEFIK_CERTRESOLVER (siehe docker-compose.release.yml) ebenfalls auf
      # letsencryptdns stehen, da die HTTP-01-Challenge auf einem privaten Port nicht
      # funktioniert.
      - "${TRAEFIK_WEB_BIND:-0.0.0.0}:80:80"
      - "${TRAEFIK_WEBSECURE_BIND:-0.0.0.0}:443:443"
      # OpenZiti terminiert den privaten Admin-Service auf diesem Loopback-Port.
      - "127.0.0.1:${TRAEFIK_ADMIN_PORT:-8443}:8443"
    command:
      - --configFile=/etc/traefik/traefik.yml

  # Wartungsseite (1.4.3, RUNBOOK Abschnitt 20): Während eines Updates oder wenn ein App-Container
  # nicht erreichbar ist, sehen Nutzer statt einer nackten Traefik-Fehlerseite (502/503/504, 404)
  # eine Wartungsseite bzw. die API ein JSON-503 mit Retry-After. Gehört zum Traefik-Teil des
  # Stacks: deploy.sh erstellt ihn bei einem App-Update nicht neu (Image und Konfiguration bleiben
  # gleich), er läuft also weiter, während die App-Container wechseln.
  # - errors-Middlewares und der Dienst für Traefik: infra/traefik/dynamic/maintenance.yml
  # - Ausweich-Router (unten, Priorität 1 bzw. 50): greifen nur, wenn die App-Router fehlen
  #   (Container gestoppt, entfernt oder noch nicht healthy - Traefik übernimmt nur gesunde).
  # - Inhalte: infra/maintenance/ (read-only gemountet, kommen mit dem Deploy-Code; nginx liest
  #   HTML/JSON bei jeder Anfrage, nginx.conf nur beim Start -> sync_maintenance_page_config).
  # Gleiches Basis-Image wie docs-site (nginx-unprivileged, UID 101, Port 8080); kein eigener Build.
  maintenance-page:
    image: nginxinc/nginx-unprivileged:alpine@sha256:b5047b9b76845eac124358373c6852377c52e4b05834a47647e955dd91cb8f1e
    restart: unless-stopped
    mem_limit: 64m
    cpus: 0.25
    init: true
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # infra/maintenance gehört wie infra/traefik/dynamic der Gruppe 5001 ohne Rechte für andere
    # (deploy.sh: prepare_thumbnail_dir) - nginx (UID 101) liest über diese Zusatzgruppe.
    group_add:
      - "5001"
    # Ohne Entrypoint-Skripte des Images: die wollen Konfigurationsdateien umschreiben
    # (read_only). Eigene, vollständige nginx.conf aus dem Repo.
    entrypoint: ["nginx", "-c", "/srv/maintenance/nginx.conf", "-g", "daemon off;"]
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,mode=1777,size=8m
    volumes:
      - ./infra/maintenance:/srv/maintenance:ro
    # Nur im internen Netz «maintenance» mit Traefik (Security-Review G2): kein Zugang zu den
    # App-Diensten im Projektnetz, kein Internet. Traefik erreicht http://maintenance-page:8080.
    networks:
      - maintenance
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
      start_interval: 2s
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=${COMPOSE_PROJECT_NAME}_maintenance"
      - "traefik.http.services.${ROUTER_PREFIX:-hocx}-maintenance-page.loadbalancer.server.port=8080"
      # Ausweich-Router: niedrigste Priorität (1) je Domain. Die App-Router haben 10/100/200/300 und
      # gewinnen im Normalbetrieb immer; fehlen sie, antwortet hier die Wartungsseite (503). Jede
      # Regel deckt genau die Pfade der App-Router ab - /admin und /api/admin auf Hauptdomain und
      # Abgabebox haben keinen Router (404, Admin-Abschottung) und bekommen auch im Normalbetrieb
      # keine Wartungsseite.
      - "traefik.http.routers.${ROUTER_PREFIX:-hocx}-fallback.rule=Host(`${TRAEFIK_DOMAIN}`) && !PathPrefix(`/admin`) && !PathPrefix(`/api/admin`)"
      - "traefik.http.routers.${ROUTER_PREFIX:-hocx}-fallback.entrypoints=websecure"
      - "traefik.http.routers.${ROUTER_PREFIX:-hocx}-fallback.tls.certresolver=${TRAEFIK_CERTRESOLVER:-letsencrypt}"
      - "traefik.http.routers.${ROUTER_PREFIX:-hocx}-fallback.priority=1"
      - "traefik.http.routers.${ROUTER_PREFIX:-hocx}-fallback.middlewares=maintenance-path-hocx@file"
      - "traefik.http.routers.${ROUTER_PREFIX:-hocx}-fallback.service=${ROUTER_PREFIX:-hocx}-maintenance-page"
      - "traefik.http.routers.${ROUTER_PREFIX:-hocx}-fallback-abgabebox.rule=Host(`${TRAEFIK_ABGABEBOX_DOMAIN}`) && !PathPrefix(`/api/admin`) && !PathPrefix(`/admin`)"
      - "traefik.http.routers.${ROUTER_PREFIX:-hocx}-fallback-abgabebox.entrypoints=websecure"
      - "traefik.http.routers.${ROUTER_PREFIX:-hocx}-fallback-abgabebox.tls.certresolver=${TRAEFIK_CERTRESOLVER:-letsencrypt}"
      - "traefik.http.routers.${ROUTER_PREFIX:-hocx}-fallback-abgabebox.priority=1"
      - "traefik.http.routers.${ROUTER_PREFIX:-hocx}-fallback-abgabebox.middlewares=maintenance-path-abgabebox@file"
      - "traefik.http.routers.${ROUTER_PREFIX:-hocx}-fallback-abgabebox.service=${ROUTER_PREFIX:-hocx}-maintenance-page"
      # Admin-Entrypoint: auch die Wartungsseite nur über das Admin-Gate (Quellbeschränkung auf den
      # Ziti-Tunnel, scripts/tests/test_admin_isolation.sh)
      - "traefik.http.routers.${ROUTER_PREFIX:-hocx}-fallback-admin.rule=Host(`${TRAEFIK_ADMIN_DOMAIN}`)"
      - "traefik.http.routers.${ROUTER_PREFIX:-hocx}-fallback-admin.entrypoints=adminsecure"
      - "traefik.http.routers.${ROUTER_PREFIX:-hocx}-fallback-admin.tls.certresolver=letsencryptdns"
      - "traefik.http.routers.${ROUTER_PREFIX:-hocx}-fallback-admin.priority=1"
      - "traefik.http.routers.${ROUTER_PREFIX:-hocx}-fallback-admin.middlewares=maintenance-path-admin@file,admin-gate@file"
      - "traefik.http.routers.${ROUTER_PREFIX:-hocx}-fallback-admin.service=${ROUTER_PREFIX:-hocx}-maintenance-page"
      # API-Pfade: JSON-503 statt HTML. Priorität 50 liegt über den Frontend-Routern (10), die /api
      # sonst übernähmen, wenn nur das Backend fehlt (Next.js antwortete mit einer 404-HTML-Seite),
      # und unter den Backend-Routern (100-300). Die Regeln entsprechen genau den Backend-Routern;
      # /api/admin gibt es nur auf der Admin-Domain (Admin-Abschottung).
      - "traefik.http.routers.${ROUTER_PREFIX:-hocx}-fallback-api.rule=Host(`${TRAEFIK_DOMAIN}`) && PathPrefix(`/api`) && !PathPrefix(`/api/admin`)"
      - "traefik.http.routers.${ROUTER_PREFIX:-hocx}-fallback-api.entrypoints=websecure"
      - "traefik.http.routers.${ROUTER_PREFIX:-hocx}-fallback-api.tls.certresolver=${TRAEFIK_CERTRESOLVER:-letsencrypt}"
      - "traefik.http.routers.${ROUTER_PREFIX:-hocx}-fallback-api.priority=50"
      - "traefik.http.routers.${ROUTER_PREFIX:-hocx}-fallback-api.middlewares=maintenance-path-api@file"
      - "traefik.http.routers.${ROUTER_PREFIX:-hocx}-fallback-api.service=${ROUTER_PREFIX:-hocx}-maintenance-page"
      - "traefik.http.routers.${ROUTER_PREFIX:-hocx}-fallback-abgabebox-api.rule=Host(`${TRAEFIK_ABGABEBOX_DOMAIN}`) && PathPrefix(`/api`) && !PathPrefix(`/api/admin`)"
      - "traefik.http.routers.${ROUTER_PREFIX:-hocx}-fallback-abgabebox-api.entrypoints=websecure"
      - "traefik.http.routers.${ROUTER_PREFIX:-hocx}-fallback-abgabebox-api.tls.certresolver=${TRAEFIK_CERTRESOLVER:-letsencrypt}"
      - "traefik.http.routers.${ROUTER_PREFIX:-hocx}-fallback-abgabebox-api.priority=50"
      - "traefik.http.routers.${ROUTER_PREFIX:-hocx}-fallback-abgabebox-api.middlewares=maintenance-path-api@file"
      - "traefik.http.routers.${ROUTER_PREFIX:-hocx}-fallback-abgabebox-api.service=${ROUTER_PREFIX:-hocx}-maintenance-page"
      - "traefik.http.routers.${ROUTER_PREFIX:-hocx}-fallback-admin-api.rule=Host(`${TRAEFIK_ADMIN_DOMAIN}`) && PathPrefix(`/api/admin`)"
      - "traefik.http.routers.${ROUTER_PREFIX:-hocx}-fallback-admin-api.entrypoints=adminsecure"
      - "traefik.http.routers.${ROUTER_PREFIX:-hocx}-fallback-admin-api.tls.certresolver=letsencryptdns"
      - "traefik.http.routers.${ROUTER_PREFIX:-hocx}-fallback-admin-api.priority=50"
      - "traefik.http.routers.${ROUTER_PREFIX:-hocx}-fallback-admin-api.middlewares=maintenance-path-api@file,admin-gate@file"
      - "traefik.http.routers.${ROUTER_PREFIX:-hocx}-fallback-admin-api.service=${ROUTER_PREFIX:-hocx}-maintenance-page"

volumes:
  traefik_tmp:

networks:
  edge: {}
  # Nur Traefik und sein Socket-Proxy (MAIN-OPS-004).
  traefik-docker-api:
    internal: true
  # Nur Traefik und die Wartungsseite.
  maintenance:
    internal: true

secrets:
  # file: statt environment: - siehe docker-compose.release.yml fuer die Begruendung
  # (Compose v5.5.0 lehnt environment-Secrets auf read_only-Services ab).
  cf_dns_api_token:
    file: ${HOCX_SECRETS_DIR:-./.secrets}/cf_dns_api_token
