services:
  db:
    image: postgres:16@sha256:ca0bd484cb98bf4b24eb1010e73fb3fcbd6714d240fbc1a10eea5b7dbecb641d
    restart: unless-stopped
    # Audit I1, 2026-08-16: this file had NO resource limits at all, unlike
    # docker-compose.yml (dev) after M28 - a runaway container here could take down the
    # whole host with nothing to stop it. Values mirror docker-compose.yml's equivalents.
    # Raised 2026-09-02 after the prod host was resized to 16GB/8 cores (was tuned for a
    # much smaller box) - see backend's mem_limit comment below for the OOM this was
    # discovered alongside.
    mem_limit: 1536m
    cpus: 2.0
    # Audit finding, 2026-08-16/2026-08-26: mirrors docker-compose.yml's (dev) equivalent -
    # see the comment there for the reasoning. Retuned 2026-09-02 to the new 1536m
    # mem_limit above (shared_buffers ~25%, effective_cache_size ~75%, standard Postgres
    # sizing heuristics) - plus pg_stat_statements so slow/frequent queries are
    # diagnosable in prod.
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - pg_stat_statements.max=5000
      - -c
      - pg_stat_statements.track=all
      - -c
      - shared_buffers=384MB
      - -c
      - effective_cache_size=1152MB
      - -c
      - work_mem=16MB
      - -c
      - maintenance_work_mem=128MB
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
    restart: unless-stopped
    mem_limit: 256m
    cpus: 0.5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # Eigenes internes Netz nur zwischen Backend und Redis (Audit MAIN-OPS-005): Redis haelt
    # Domain-Bridge- und MFA-Flow-Tokens sowie Lockout-Zaehler ohne eigene Authentifizierung. Im
    # Default-Netz haette jeder kompromittierte oeffentliche Dienst (abgabebox, Frontends) daraus
    # eine Sitzung als beliebiger Nutzer erzeugen koennen.
    networks:
      - cache
    # Passwort aus dem Secret (MAIN-OPS-005), nicht als Argument (sonst in der Prozessliste
    # sichtbar): Konfigurationsdatei schreiben, dann wie gewohnt über das Entrypoint-Skript
    # starten, das auf den Benutzer redis wechselt.
    secrets:
      - redis_password
    command:
      - sh
      - -c
      - >-
        umask 027 &&
        printf 'requirepass %s\n' "$$(cat /run/secrets/redis_password)" > /tmp/redis.conf &&
        chown root:redis /tmp/redis.conf &&
        exec docker-entrypoint.sh redis-server /tmp/redis.conf
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$(cat /run/secrets/redis_password)\" redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Nur-Lese-Zugang zur Docker-API für den Systemstatus (/admin/system). Das Backend bekommt nie
  # den Docker-Socket selbst (Socket = root auf dem Host); der Proxy erlaubt nur GET auf
  # /containers, /_ping und /version (alles andere 403, getestet 2026-10-11). Eigenes internes Netz
  # docker-api: nur das Backend erreicht ihn - die öffentlich erreichbaren Dienste (abgabebox,
  # Frontends) könnten sonst die Umgebungsvariablen aller Container auslesen.
  docker-socket-proxy:
    image: lscr.io/linuxserver/socket-proxy:3.4.6-r0-ls101@sha256:362cadf55b3c7920189347d0f4d60b389e2f80e929581bf10793f2371aab41e5
    restart: unless-stopped
    mem_limit: 64m
    cpus: 0.25
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /run
    environment:
      CONTAINERS: 1
      PING: 1
      VERSION: 1
      POST: 0
      LOG_LEVEL: warning
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - docker-api
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  backend:
    image: ${HOCX_BACKEND_IMAGE:-ghcr.io/${GHCR_NAMESPACE}/hocx-backend:${HOCX_VERSION}}
    restart: unless-stopped
    # Zwei Worker und die Bildverarbeitung teilen sich dieses Budget. ZIPs werden
    # auf Platte gepuffert; im Speicher liegen höchstens vier Bilder à 100 MiB plus Decoder.
    mem_limit: 6144m
    cpus: 3.0
    init: true
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      HOCX_ENVIRONMENT: ${HOCX_ENVIRONMENT:-production}
      DATABASE_URL_FILE: /run/secrets/database_url
      APP_DATABASE_URL_FILE: /run/secrets/app_database_url
      APP_DB_PASSWORD_FILE: /run/secrets/app_db_password
      AUTH_SECRET_FILE: /run/secrets/auth_secret
      ADMIN_AUTH_SECRET_FILE: /run/secrets/admin_auth_secret
      INITIAL_ADMIN_PASSWORD_FILE: /run/secrets/initial_admin_password
      ABGABEBOX_DB_PASSWORD_FILE: /run/secrets/abgabebox_db_password
      # Migration 0067 creates the hocx_photo_worker role (see photo-analysis-worker/) -
      # needed here too since deploy.sh runs `alembic upgrade head` through this service
      # (`run --rm backend alembic …`); the image's own CMD only starts uvicorn.
      PHOTO_WORKER_DB_PASSWORD_FILE: /run/secrets/photo_worker_db_password
      PYTHONPATH: /app
      STORAGE_ROOT: /app/storage
      EXPORT_ROOT: /app/storage/exports
      UPLOAD_ROOT: /app/storage/uploads
      THUMBNAIL_ROOT: /app/storage-local/thumbnails
      ABGABEBOX_STORAGE_ROOT: /app/abgabebox-storage
      POSTGRES_DB: ${POSTGRES_DB}
      INITIAL_ADMIN_EMAIL: ${INITIAL_ADMIN_EMAIL}
      TRAEFIK_DOMAIN: ${TRAEFIK_DOMAIN}
      # Erwarteter WebAuthn-Origin der Plattform-Admin-Passkeys (Security-Audit SEC-021).
      TRAEFIK_ADMIN_DOMAIN: ${TRAEFIK_ADMIN_DOMAIN}
      TRAEFIK_ABGABEBOX_DOMAIN: ${TRAEFIK_ABGABEBOX_DOMAIN}
      ABGABEBOX_BASE_URL: https://${TRAEFIK_ABGABEBOX_DOMAIN}
      CLAMAV_HOST: clamav
      REDIS_URL: redis://redis:6379/0
      REDIS_PASSWORD_FILE: /run/secrets/redis_password
      DOCKER_API_URL: http://docker-socket-proxy:2375
      TRAEFIK_DYNAMIC_CONFIG_DIR: /app/traefik_dynamic
      ROUTER_PREFIX: ${ROUTER_PREFIX:-hocx}
      TRAEFIK_MIDDLEWARE_PREFIX: ${ROUTER_PREFIX:-hocx}-
      DOMAIN_HEALTH_CHECK_INTERVAL_MINUTES: ${DOMAIN_HEALTH_CHECK_INTERVAL_MINUTES:-5}
      PHOTO_ANALYSIS_AUTO_QUEUE_INTERVAL_MINUTES: ${PHOTO_ANALYSIS_AUTO_QUEUE_INTERVAL_MINUTES:-5}
      PHOTO_ANALYSIS_AUTO_QUEUE_START_HOUR: ${PHOTO_ANALYSIS_AUTO_QUEUE_START_HOUR:-0}
      PHOTO_ANALYSIS_AUTO_QUEUE_END_HOUR: ${PHOTO_ANALYSIS_AUTO_QUEUE_END_HOUR:-24}
      PHOTO_ANALYSIS_AUTO_QUEUE_MAX_LOAD_FACTOR: ${PHOTO_ANALYSIS_AUTO_QUEUE_MAX_LOAD_FACTOR:-0.7}
      ABGABEBOX_RESCAN_INTERVAL_MINUTES: ${ABGABEBOX_RESCAN_INTERVAL_MINUTES:-15}
      WORD_IMPORT_RESCAN_INTERVAL_MINUTES: ${WORD_IMPORT_RESCAN_INTERVAL_MINUTES:-15}
      EXPORT_CLEANUP_INTERVAL_MINUTES: ${EXPORT_CLEANUP_INTERVAL_MINUTES:-1440}
      EXPORT_RETENTION_DAYS: ${EXPORT_RETENTION_DAYS:-30}
      LOG_CLEANUP_INTERVAL_MINUTES: ${LOG_CLEANUP_INTERVAL_MINUTES:-1440}
      AUDIT_LOG_RETENTION_DAYS: ${AUDIT_LOG_RETENTION_DAYS:-730}
      ERROR_LOG_RETENTION_DAYS: ${ERROR_LOG_RETENTION_DAYS:-90}
      PROTOCOL_IMAGE_STORAGE_QUOTA_MB: ${PROTOCOL_IMAGE_STORAGE_QUOTA_MB:-2048}
      AUTH_SESSION_TTL_HOURS: ${AUTH_SESSION_TTL_HOURS:-72}
      AUTH_SESSION_COOKIE: ${AUTH_SESSION_COOKIE:-hocx_session}
      AUTH_SECURE_COOKIES: ${AUTH_SECURE_COOKIES:-true}
      ADMIN_SESSION_TTL_HOURS: ${ADMIN_SESSION_TTL_HOURS:-12}
      ADMIN_SESSION_COOKIE: ${ADMIN_SESSION_COOKIE:-hocx_admin_session}
      CLAMAV_PORT: ${CLAMAV_PORT:-3310}
      # Read only by scripts/seed_test_tenant.py (backend/app/core/config.py never touches
      # it) - lets a developer enroll the demo accounts' TOTP once in their own
      # authenticator and keep using it across every reseed, instead of re-scanning a QR
      # code after each test deploy. Deploy.sh only ever runs that script when
      # ENVIRONMENT=test, and the script itself refuses to run against a
      # HOCX_ENVIRONMENT=production backend - setting this here is inert on prod either way.
      DEMO_TOTP_SEED: ${DEMO_TOTP_SEED:-}
      # Öffentliche Prüfseite (Abgabebox), steht in jedem PDF; leer = ABGABEBOX_BASE_URL/verify
      DOCUMENT_VERIFY_BASE_URL: ${DOCUMENT_VERIFY_BASE_URL:-}
      # Objektspeicher (docs-site/docs/technik/storage/): Profil-Zugangsdaten-Schlüssel und lokales Garage-S3.
      STORAGE_CREDENTIALS_KEY_FILE: /run/secrets/storage_credentials_key
      STORAGE_WORK_ROOT: /app/storage-local/work
      STORAGE_FALLBACK_DAYS: ${STORAGE_FALLBACK_DAYS:-14}
      # Nur zur Anzeige/Überwachung (Job-Registry, /admin/backups) - Zugang zum Repository hat
      # ausschliesslich der backup-worker.
      BACKUP_ENABLED: ${BACKUP_ENABLED:-false}
      LOCAL_S3_ENDPOINT: http://local-s3:3900
      LOCAL_S3_BUCKET: hocx-main
      LOCAL_S3_ABGABEBOX_BUCKET: hocx-abgabebox
      LOCAL_S3_ACCESS_KEY: ${LOCAL_S3_ACCESS_KEY}
      LOCAL_S3_SECRET_KEY_FILE: /run/secrets/local_s3_secret_key
      LOCAL_S3_ABGABEBOX_ACCESS_KEY: ${LOCAL_S3_ABGABEBOX_ACCESS_KEY}
      LOCAL_S3_ABGABEBOX_SECRET_KEY_FILE: /run/secrets/local_s3_abgabebox_secret_key
    secrets:
      - database_url
      - app_database_url
      - app_db_password
      - auth_secret
      - admin_auth_secret
      - initial_admin_password
      - abgabebox_db_password
      - photo_worker_db_password
      - storage_credentials_key
      - local_s3_secret_key
      - local_s3_abgabebox_secret_key
      - redis_password
    networks:
      - default
      - docker-api
      - storage
      - cache
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      # Multipart-Parser puffert grosse Dateien hier auf Platte, niemals im RAM.
      - backend_upload_tmp:/tmp
      # HOCX_STORAGE_PATH (.env) zeigt lokal auf ./storage; sobald ein Cloud Volume gemountet
      # ist, dort umbiegen - kein Compose-/Code-Aendern noetig.
      - ${HOCX_STORAGE_PATH:-./storage}:/app/storage
      # Bewusst NICHT ueber HOCX_STORAGE_PATH gesteuert - dieser Ordner bleibt IMMER lokal,
      # auch wenn /app/storage spaeter auf ein Netzwerk-/Cloud-Volume umgehaengt wird
      # (siehe FileService.ensure_thumbnail).
      - ./storage-local/thumbnails:/app/storage-local/thumbnails
      - ./storage-local/work:/app/storage-local/work
      - ${HOCX_STORAGE_PATH:-./storage}/abgabebox-uploads:/app/abgabebox-storage
      - ./infra/traefik/dynamic:/app/traefik_dynamic
    healthcheck:
      # Kein curl im python:3.13-slim-Image (siehe Audit) - urllib aus der Stdlib genuegt fuer
      # einen simplen Liveness-Check gegen den Health-Endpoint aus app/main.py.
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    labels:
      - "traefik.enable=true"
      # Das Backend hängt zusätzlich im internen Netz docker-api - ohne diese Angabe wählt Traefik
      # je nach Reihenfolge die dort unerreichbare IP.
      - "traefik.docker.network=${COMPOSE_PROJECT_NAME}_default"
      - "traefik.http.routers.${ROUTER_PREFIX:-hocx}-backend.rule=Host(`${TRAEFIK_DOMAIN}`) && ((PathPrefix(`/api`) && !PathPrefix(`/api/admin`)) || PathPrefix(`/docs`) || PathPrefix(`/openapi.json`))"
      - "traefik.http.routers.${ROUTER_PREFIX:-hocx}-backend.middlewares=${ROUTER_PREFIX:-hocx}-api-inflight"
      - "traefik.http.routers.${ROUTER_PREFIX:-hocx}-backend.entrypoints=websecure"
      - "traefik.http.routers.${ROUTER_PREFIX:-hocx}-backend.tls.certresolver=${TRAEFIK_CERTRESOLVER:-letsencrypt}"
      - "traefik.http.routers.${ROUTER_PREFIX:-hocx}-backend.priority=100"
      - "traefik.http.routers.${ROUTER_PREFIX:-hocx}-backend.service=${ROUTER_PREFIX:-hocx}-backend"
      - "traefik.http.services.${ROUTER_PREFIX:-hocx}-backend.loadbalancer.server.port=8000"
      - "traefik.http.middlewares.${ROUTER_PREFIX:-hocx}-api-inflight.inflightreq.amount=100"
      - "traefik.http.middlewares.${ROUTER_PREFIX:-hocx}-api-inflight.inflightreq.sourcecriterion.ipstrategy.depth=0"
      - "traefik.http.routers.${ROUTER_PREFIX:-hocx}-admin-api.rule=Host(`${TRAEFIK_ADMIN_DOMAIN}`) && PathPrefix(`/api/admin`)"
      - "traefik.http.routers.${ROUTER_PREFIX:-hocx}-admin-api.entrypoints=adminsecure"
      - "traefik.http.routers.${ROUTER_PREFIX:-hocx}-admin-api.tls.certresolver=letsencryptdns"
      - "traefik.http.routers.${ROUTER_PREFIX:-hocx}-admin-api.priority=100"
      - "traefik.http.routers.${ROUTER_PREFIX:-hocx}-admin-api.service=${ROUTER_PREFIX:-hocx}-admin-api"
      - "traefik.http.services.${ROUTER_PREFIX:-hocx}-admin-api.loadbalancer.server.port=8000"
      - "traefik.http.routers.${ROUTER_PREFIX:-hocx}-auth.rule=Host(`${TRAEFIK_DOMAIN}`) && Path(`/api/auth/login`) && Method(`POST`)"
      - "traefik.http.routers.${ROUTER_PREFIX:-hocx}-auth.entrypoints=websecure"
      - "traefik.http.routers.${ROUTER_PREFIX:-hocx}-auth.tls.certresolver=${TRAEFIK_CERTRESOLVER:-letsencrypt}"
      - "traefik.http.routers.${ROUTER_PREFIX:-hocx}-auth.priority=200"
      - "traefik.http.routers.${ROUTER_PREFIX:-hocx}-auth.service=${ROUTER_PREFIX:-hocx}-auth"
      - "traefik.http.routers.${ROUTER_PREFIX:-hocx}-auth.middlewares=${ROUTER_PREFIX:-hocx}-auth-ratelimit"
      - "traefik.http.services.${ROUTER_PREFIX:-hocx}-auth.loadbalancer.server.port=8000"
      - "traefik.http.middlewares.${ROUTER_PREFIX:-hocx}-auth-ratelimit.ratelimit.average=10"
      - "traefik.http.middlewares.${ROUTER_PREFIX:-hocx}-auth-ratelimit.ratelimit.burst=5"
      - "traefik.http.middlewares.${ROUTER_PREFIX:-hocx}-auth-ratelimit.ratelimit.period=1m"
      - "traefik.http.routers.${ROUTER_PREFIX:-hocx}-admin-auth.rule=Host(`${TRAEFIK_ADMIN_DOMAIN}`) && Path(`/api/admin/auth/login`) && Method(`POST`)"
      - "traefik.http.routers.${ROUTER_PREFIX:-hocx}-admin-auth.entrypoints=adminsecure"
      - "traefik.http.routers.${ROUTER_PREFIX:-hocx}-admin-auth.tls.certresolver=letsencryptdns"
      - "traefik.http.routers.${ROUTER_PREFIX:-hocx}-admin-auth.priority=200"
      - "traefik.http.routers.${ROUTER_PREFIX:-hocx}-admin-auth.service=${ROUTER_PREFIX:-hocx}-admin-auth"
      - "traefik.http.routers.${ROUTER_PREFIX:-hocx}-admin-auth.middlewares=${ROUTER_PREFIX:-hocx}-auth-ratelimit"
      - "traefik.http.services.${ROUTER_PREFIX:-hocx}-admin-auth.loadbalancer.server.port=8000"
      # Audit finding, 2026-08-27: /api/auth/mfa/totp/verify and /api/auth/tenant-by-domain
      # previously fell through to the generic backend router with no Traefik-level rate
      # limit at all, unlike /api/auth/login - defense in depth on top of the backend's own
      # (in-progress, per-account) rate limiting for these two endpoints.
      # TOTP verify: slightly more permissive than login's 10/min, since a legitimate user
      # may retry a mistyped code a couple of times.
      - "traefik.http.routers.${ROUTER_PREFIX:-hocx}-mfa-totp-verify.rule=Host(`${TRAEFIK_DOMAIN}`) && Path(`/api/auth/mfa/totp/verify`) && Method(`POST`)"
      - "traefik.http.routers.${ROUTER_PREFIX:-hocx}-mfa-totp-verify.entrypoints=websecure"
      - "traefik.http.routers.${ROUTER_PREFIX:-hocx}-mfa-totp-verify.tls.certresolver=${TRAEFIK_CERTRESOLVER:-letsencrypt}"
      - "traefik.http.routers.${ROUTER_PREFIX:-hocx}-mfa-totp-verify.priority=200"
      - "traefik.http.routers.${ROUTER_PREFIX:-hocx}-mfa-totp-verify.service=${ROUTER_PREFIX:-hocx}-mfa-totp-verify"
      - "traefik.http.routers.${ROUTER_PREFIX:-hocx}-mfa-totp-verify.middlewares=${ROUTER_PREFIX:-hocx}-mfa-totp-verify-ratelimit"
      - "traefik.http.services.${ROUTER_PREFIX:-hocx}-mfa-totp-verify.loadbalancer.server.port=8000"
      - "traefik.http.middlewares.${ROUTER_PREFIX:-hocx}-mfa-totp-verify-ratelimit.ratelimit.average=20"
      - "traefik.http.middlewares.${ROUTER_PREFIX:-hocx}-mfa-totp-verify-ratelimit.ratelimit.burst=10"
      - "traefik.http.middlewares.${ROUTER_PREFIX:-hocx}-mfa-totp-verify-ratelimit.ratelimit.period=1m"
      # tenant-by-domain: public, unauthenticated lookup polled on every page load
      # pre-login - looser than login so normal login-page usage never trips it.
      - "traefik.http.routers.${ROUTER_PREFIX:-hocx}-tenant-by-domain.rule=Host(`${TRAEFIK_DOMAIN}`) && Path(`/api/auth/tenant-by-domain`) && Method(`GET`)"
      - "traefik.http.routers.${ROUTER_PREFIX:-hocx}-tenant-by-domain.entrypoints=websecure"
      - "traefik.http.routers.${ROUTER_PREFIX:-hocx}-tenant-by-domain.tls.certresolver=${TRAEFIK_CERTRESOLVER:-letsencrypt}"
      - "traefik.http.routers.${ROUTER_PREFIX:-hocx}-tenant-by-domain.priority=200"
      - "traefik.http.routers.${ROUTER_PREFIX:-hocx}-tenant-by-domain.service=${ROUTER_PREFIX:-hocx}-tenant-by-domain"
      - "traefik.http.routers.${ROUTER_PREFIX:-hocx}-tenant-by-domain.middlewares=${ROUTER_PREFIX:-hocx}-tenant-by-domain-ratelimit"
      - "traefik.http.services.${ROUTER_PREFIX:-hocx}-tenant-by-domain.loadbalancer.server.port=8000"
      - "traefik.http.middlewares.${ROUTER_PREFIX:-hocx}-tenant-by-domain-ratelimit.ratelimit.average=30"
      - "traefik.http.middlewares.${ROUTER_PREFIX:-hocx}-tenant-by-domain-ratelimit.ratelimit.burst=15"
      - "traefik.http.middlewares.${ROUTER_PREFIX:-hocx}-tenant-by-domain-ratelimit.ratelimit.period=1m"
      # Dedicated live router for tenant ZIP imports. The 2050 MiB request limit covers the
      # backend's 2 GiB ZIP limit plus multipart/form-data overhead without raising the limit
      # for any other admin/API endpoint.
      - "traefik.http.routers.${ROUTER_PREFIX:-hocx}-tenant-import.rule=Host(`${TRAEFIK_ADMIN_DOMAIN}`) && Path(`/api/admin/tenants/import`) && Method(`POST`)"
      - "traefik.http.routers.${ROUTER_PREFIX:-hocx}-tenant-import.entrypoints=adminsecure"
      - "traefik.http.routers.${ROUTER_PREFIX:-hocx}-tenant-import.tls.certresolver=letsencryptdns"
      - "traefik.http.routers.${ROUTER_PREFIX:-hocx}-tenant-import.priority=200"
      - "traefik.http.routers.${ROUTER_PREFIX:-hocx}-tenant-import.service=${ROUTER_PREFIX:-hocx}-tenant-import"
      - "traefik.http.routers.${ROUTER_PREFIX:-hocx}-tenant-import.middlewares=${ROUTER_PREFIX:-hocx}-tenant-import-body-limit"
      - "traefik.http.services.${ROUTER_PREFIX:-hocx}-tenant-import.loadbalancer.server.port=8000"
      - "traefik.http.middlewares.${ROUTER_PREFIX:-hocx}-tenant-import-body-limit.buffering.maxRequestBodyBytes=2149580800"
      - "traefik.http.routers.${ROUTER_PREFIX:-hocx}-word-import.rule=Host(`${TRAEFIK_DOMAIN}`) && PathPrefix(`/api/tools/word-import`) && Method(`POST`)"
      - "traefik.http.routers.${ROUTER_PREFIX:-hocx}-word-import.entrypoints=websecure"
      - "traefik.http.routers.${ROUTER_PREFIX:-hocx}-word-import.tls.certresolver=${TRAEFIK_CERTRESOLVER:-letsencrypt}"
      - "traefik.http.routers.${ROUTER_PREFIX:-hocx}-word-import.priority=200"
      - "traefik.http.routers.${ROUTER_PREFIX:-hocx}-word-import.service=${ROUTER_PREFIX:-hocx}-word-import"
      - "traefik.http.routers.${ROUTER_PREFIX:-hocx}-word-import.middlewares=${ROUTER_PREFIX:-hocx}-word-import-ratelimit,${ROUTER_PREFIX:-hocx}-word-import-body-limit"
      - "traefik.http.services.${ROUTER_PREFIX:-hocx}-word-import.loadbalancer.server.port=8000"
      - "traefik.http.middlewares.${ROUTER_PREFIX:-hocx}-word-import-ratelimit.ratelimit.average=20"
      - "traefik.http.middlewares.${ROUTER_PREFIX:-hocx}-word-import-ratelimit.ratelimit.burst=10"
      - "traefik.http.middlewares.${ROUTER_PREFIX:-hocx}-word-import-ratelimit.ratelimit.period=1m"
      - "traefik.http.middlewares.${ROUTER_PREFIX:-hocx}-word-import-body-limit.buffering.maxRequestBodyBytes=157286400"

      # Galerie streamt direkt zum Backend (10 GiB + 1 MiB, dort begrenzt).
      # Kein Traefik-Buffer: sonst läge jedes ZIP doppelt auf Platte.
      - "traefik.http.routers.${ROUTER_PREFIX:-hocx}-gallery-upload.rule=Host(`${TRAEFIK_DOMAIN}`) && Path(`/api/files/gallery-uploads`) && Method(`POST`)"
      - "traefik.http.routers.${ROUTER_PREFIX:-hocx}-gallery-upload.entrypoints=websecure"
      - "traefik.http.routers.${ROUTER_PREFIX:-hocx}-gallery-upload.tls.certresolver=${TRAEFIK_CERTRESOLVER:-letsencrypt}"
      - "traefik.http.routers.${ROUTER_PREFIX:-hocx}-gallery-upload.priority=200"
      - "traefik.http.routers.${ROUTER_PREFIX:-hocx}-gallery-upload.service=${ROUTER_PREFIX:-hocx}-gallery-upload"
      - "traefik.http.routers.${ROUTER_PREFIX:-hocx}-gallery-upload.middlewares=${ROUTER_PREFIX:-hocx}-gallery-upload-inflight"
      - "traefik.http.services.${ROUTER_PREFIX:-hocx}-gallery-upload.loadbalancer.server.port=8000"
      - "traefik.http.middlewares.${ROUTER_PREFIX:-hocx}-gallery-upload-inflight.inflightreq.amount=2"

  # Photo-culling Phase 3: scores face quality for photo_analysis_job batches. Own
  # container/resource budget, not inside `backend` - see photo-analysis-worker/README.md.
  # No exposed port, no Traefik labels - this never serves HTTP, only polls Postgres.
  photo-analysis-worker:
    image: ${HOCX_PHOTO_ANALYSIS_WORKER_IMAGE:-ghcr.io/${GHCR_NAMESPACE}/hocx-photo-analysis-worker:${HOCX_VERSION}}
    restart: unless-stopped
    mem_limit: 1280m
    cpus: 1.5
    init: true
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # Der Worker laeuft als uid 5002 (photo-analysis-worker/Dockerfile), der gehaertete
    # Storage (deploy.sh: prepare_runtime_permissions) ist aber nur fuer Gruppe 5001
    # zugaenglich (Modus 2770, "others" ohne Rechte). Ohne die Gruppe scheitert jeder
    # Lesezugriff auf die Originale mit "Permission denied".
    group_add:
      - "5001"
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,mode=1777
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      PHOTO_WORKER_DATABASE_URL_FILE: /run/secrets/photo_worker_database_url
      STORAGE_ROOT: /app/storage
      ABGABEBOX_STORAGE_ROOT: /app/storage/abgabebox-uploads
      STORAGE_CREDENTIALS_KEY_FILE: /run/secrets/storage_credentials_key
    secrets:
      - photo_worker_database_url
      - storage_credentials_key
    networks:
      - default
      - storage
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - ${HOCX_STORAGE_PATH:-./storage}:/app/storage:ro

  frontend:
    image: ${HOCX_FRONTEND_IMAGE:-ghcr.io/${GHCR_NAMESPACE}/hocx-frontend:${HOCX_VERSION}}
    restart: unless-stopped
    # Runs a pre-built image's `next start` here (no runtime build, unlike the dev
    # compose's frontend - see its mem_limit comment there), so this is lighter
    # than the dev value, but still bounded per audit I1. Raised 2026-09-02 alongside
    # backend's OOM fix now that the host has 16GB/8 cores.
    mem_limit: 1024m
    cpus: 1.5
    init: true
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,mode=1777
      - /app/.next/cache:rw,noexec,nosuid,nodev,uid=1000,gid=1000,mode=0750
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
      INTERNAL_API_URL: ${INTERNAL_API_URL}
      TRAEFIK_DOMAIN: ${TRAEFIK_DOMAIN}
      TRAEFIK_ADMIN_DOMAIN: ${TRAEFIK_ADMIN_DOMAIN}
      TRAEFIK_WEBSITE_DOMAIN: ${TRAEFIK_WEBSITE_DOMAIN:-}
      WEBSITE_CONTACT_EMAIL: ${WEBSITE_CONTACT_EMAIL:-}
      HOCX_VERSION: ${HOCX_VERSION}
      HOCX_ENVIRONMENT: ${HOCX_ENVIRONMENT:-production}
      HOCX_FRONTEND_IMAGE: ${HOCX_FRONTEND_IMAGE:-}
      HOCX_APP_URL: ${HOCX_APP_URL:-}
    depends_on:
      - backend
    healthcheck:
      # Anders als der dev-Container (der auf der node:22-bookworm "deps"-Stage laeuft) hat das
      # hier gebaute Release-Image nur die node:22-bookworm-slim "run"-Stage - kein curl/wget
      # (verifiziert gegen ghcr.io/.../hocx-frontend), aber node selbst ist immer da.
      # "/" liefert bei fehlender Session ein 307 nach /login statt eines 200 - als reiner
      # Liveness-Check reicht "hat ueberhaupt geantwortet, kein 5xx/Verbindungsfehler".
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/', res => process.exit(res.statusCode < 500 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.${ROUTER_PREFIX:-hocx}-frontend.rule=Host(`${TRAEFIK_DOMAIN}`) && !PathPrefix(`/admin`)"
      - "traefik.http.middlewares.${ROUTER_PREFIX:-hocx}-web-inflight.inflightreq.amount=200"
      - "traefik.http.middlewares.${ROUTER_PREFIX:-hocx}-web-inflight.inflightreq.sourcecriterion.ipstrategy.depth=0"
      - "traefik.http.routers.${ROUTER_PREFIX:-hocx}-frontend.middlewares=${ROUTER_PREFIX:-hocx}-web-inflight"
      - "traefik.http.routers.${ROUTER_PREFIX:-hocx}-frontend.entrypoints=websecure"
      - "traefik.http.routers.${ROUTER_PREFIX:-hocx}-frontend.tls.certresolver=${TRAEFIK_CERTRESOLVER:-letsencrypt}"
      - "traefik.http.routers.${ROUTER_PREFIX:-hocx}-frontend.priority=10"
      - "traefik.http.services.${ROUTER_PREFIX:-hocx}-frontend.loadbalancer.server.port=3000"
      - "traefik.http.routers.${ROUTER_PREFIX:-hocx}-admin-frontend.rule=Host(`${TRAEFIK_ADMIN_DOMAIN}`)"
      - "traefik.http.routers.${ROUTER_PREFIX:-hocx}-admin-frontend.entrypoints=adminsecure"
      - "traefik.http.routers.${ROUTER_PREFIX:-hocx}-admin-frontend.tls.certresolver=letsencryptdns"
      - "traefik.http.routers.${ROUTER_PREFIX:-hocx}-admin-frontend.priority=10"
      - "traefik.http.routers.${ROUTER_PREFIX:-hocx}-admin-frontend.service=${ROUTER_PREFIX:-hocx}-frontend"
      # Oeffentliche Website (Landing Page) auf der Hauptdomain - proxy.ts schreibt dort jeden
      # Pfad auf /website um. Ohne TRAEFIK_WEBSITE_DOMAIN greift der Platzhalter nie, und der
      # Cert-Resolver bleibt leer - sonst versucht Traefik ein ACME-Zertifikat fuer
      # website.invalid zu holen und loggt bei jedem Start einen Fehler.
      - "traefik.http.routers.${ROUTER_PREFIX:-hocx}-website-frontend.rule=Host(`${TRAEFIK_WEBSITE_DOMAIN:-website.invalid}`)"
      - "traefik.http.routers.${ROUTER_PREFIX:-hocx}-website-frontend.middlewares=${ROUTER_PREFIX:-hocx}-web-inflight"
      - "traefik.http.routers.${ROUTER_PREFIX:-hocx}-website-frontend.entrypoints=websecure"
      - "traefik.http.routers.${ROUTER_PREFIX:-hocx}-website-frontend.tls.certresolver=${TRAEFIK_WEBSITE_DOMAIN:+${TRAEFIK_CERTRESOLVER:-letsencrypt}}"
      - "traefik.http.routers.${ROUTER_PREFIX:-hocx}-website-frontend.priority=10"
      - "traefik.http.routers.${ROUTER_PREFIX:-hocx}-website-frontend.service=${ROUTER_PREFIX:-hocx}-frontend"

  # Lokales S3 (Garage) - siehe docker-compose.yml und docs-site/docs/technik/storage/lokales-s3.md.
  local-s3:
    image: dxflrs/garage:v2.3.0@sha256:866bd13ed2038ba7e7190e840482bc27234c4afaf77be8cfa439ae088c1e4690
    restart: unless-stopped
    mem_limit: 512m
    cpus: 1.0
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      GARAGE_RPC_SECRET_FILE: /run/secrets/garage_rpc_secret
      GARAGE_ADMIN_TOKEN_FILE: /run/secrets/garage_admin_token
    secrets:
      - garage_rpc_secret
      - garage_admin_token
    volumes:
      - ./infra/garage/garage.toml:/etc/garage.toml:ro
      - local_s3_data:/var/lib/garage
    networks:
      - storage
    healthcheck:
      test: ["CMD", "/garage", "status"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  storage-init:
    image: ${HOCX_BACKEND_IMAGE:-ghcr.io/${GHCR_NAMESPACE}/hocx-backend:${HOCX_VERSION}}
    restart: "no"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    entrypoint: ["python3", "/bootstrap/bootstrap.py"]
    command: []
    environment:
      GARAGE_ADMIN_URL: http://127.0.0.1:3903
      GARAGE_ADMIN_TOKEN_FILE: /run/secrets/garage_admin_token
      LOCAL_S3_BUCKET: hocx-main
      LOCAL_S3_ABGABEBOX_BUCKET: hocx-abgabebox
      LOCAL_S3_ACCESS_KEY: ${LOCAL_S3_ACCESS_KEY}
      LOCAL_S3_SECRET_KEY_FILE: /run/secrets/local_s3_secret_key
      LOCAL_S3_ABGABEBOX_ACCESS_KEY: ${LOCAL_S3_ABGABEBOX_ACCESS_KEY}
      LOCAL_S3_ABGABEBOX_SECRET_KEY_FILE: /run/secrets/local_s3_abgabebox_secret_key
    secrets:
      - garage_admin_token
      - local_s3_secret_key
      - local_s3_abgabebox_secret_key
    volumes:
      - ./infra/garage/bootstrap.py:/bootstrap/bootstrap.py:ro
    # Admin-API lauscht nur auf 127.0.0.1 im local-s3-Container (infra/garage/garage.toml).
    network_mode: "service:local-s3"
    depends_on:
      local-s3:
        condition: service_healthy

  storage-worker:
    image: ${HOCX_BACKEND_IMAGE:-ghcr.io/${GHCR_NAMESPACE}/hocx-backend:${HOCX_VERSION}}
    restart: unless-stopped
    mem_limit: 1024m
    cpus: 1.0
    init: true
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    entrypoint: ["python", "-m", "app.workers.storage_worker"]
    command: []
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,mode=1777
    environment:
      HOCX_ENVIRONMENT: ${HOCX_ENVIRONMENT:-production}
      DATABASE_URL_FILE: /run/secrets/database_url
      APP_DATABASE_URL_FILE: /run/secrets/app_database_url
      AUTH_SECRET_FILE: /run/secrets/auth_secret
      ADMIN_AUTH_SECRET_FILE: /run/secrets/admin_auth_secret
      PYTHONPATH: /app
      STORAGE_ROOT: /app/storage
      EXPORT_ROOT: /app/storage/exports
      UPLOAD_ROOT: /app/storage/uploads
      ABGABEBOX_STORAGE_ROOT: /app/abgabebox-storage
      STORAGE_CREDENTIALS_KEY_FILE: /run/secrets/storage_credentials_key
      STORAGE_WORK_ROOT: /app/storage-local/work
      STORAGE_FALLBACK_DAYS: ${STORAGE_FALLBACK_DAYS:-14}
    secrets:
      - database_url
      - app_database_url
      - auth_secret
      - admin_auth_secret
      - storage_credentials_key
    volumes:
      - ${HOCX_STORAGE_PATH:-./storage}:/app/storage
      - ${HOCX_STORAGE_PATH:-./storage}/abgabebox-uploads:/app/abgabebox-storage
      - ./storage-local/work:/app/storage-local/work
      # Ziel von scripts/backup_storage.sh (Objekt-Backup, siehe docs technik/storage/backup.md)
      - ./backups/storage:/app/backups/storage
    networks:
      - default
      - storage
    depends_on:
      backend:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Offsite-Backup (BorgBackup -> Hetzner Storage Box), Restore und Restore-Tests
  # (docs-site/docs/technik/backup/). Einziger Dienst mit Borg-Schlüssel und -Passphrase; das
  # Backend legt nur Aufträge an. Läuft auch ohne Konfiguration (BACKUP_ENABLED=false) und meldet
  # dann "nicht eingerichtet". Superuser-DB-Zugang (DATABASE_URL), weil pg_dump alle Tabellen
  # lesen und ein Voll-Restore Datenbanken anlegen/umbenennen muss.
  backup-worker:
    image: ${HOCX_BACKEND_IMAGE:-ghcr.io/${GHCR_NAMESPACE}/hocx-backend:${HOCX_VERSION}}
    restart: unless-stopped
    # Streams statt Puffer: der Speicher hängt nicht von der Datenmenge ab (Multipart-Teile,
    # Manifest-Abschnitte, Index-Abfragen); pg_restore/pg_dump laufen als eigene Prozesse.
    mem_limit: 1536m
    cpus: 1.5
    pids_limit: 256
    init: true
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    entrypoint: ["python", "-m", "app.workers.backup_worker"]
    command: []
    # Private Kopien von SSH-Schlüssel, known_hosts und .pgpass liegen nur im RAM.
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,mode=1777,size=256m
    environment:
      HOCX_ENVIRONMENT: ${HOCX_ENVIRONMENT:-production}
      HOCX_VERSION: ${HOCX_VERSION}
      DATABASE_URL_FILE: /run/secrets/database_url
      AUTH_SECRET_FILE: /run/secrets/auth_secret
      ADMIN_AUTH_SECRET_FILE: /run/secrets/admin_auth_secret
      PYTHONPATH: /app
      STORAGE_ROOT: /app/storage
      EXPORT_ROOT: /app/storage/exports
      UPLOAD_ROOT: /app/storage/uploads
      ABGABEBOX_STORAGE_ROOT: /app/abgabebox-storage
      STORAGE_CREDENTIALS_KEY_FILE: /run/secrets/storage_credentials_key
      STORAGE_WORK_ROOT: /app/storage-local/work
      STORAGE_FALLBACK_DAYS: ${STORAGE_FALLBACK_DAYS:-14}
      REDIS_URL: redis://redis:6379/0
      TRAEFIK_DOMAIN: ${TRAEFIK_DOMAIN}
      BACKUP_ENABLED: ${BACKUP_ENABLED:-false}
      BACKUP_STORAGEBOX_HOST: ${BACKUP_STORAGEBOX_HOST:-}
      BACKUP_STORAGEBOX_PORT: ${BACKUP_STORAGEBOX_PORT:-23}
      BACKUP_STORAGEBOX_USER: ${BACKUP_STORAGEBOX_USER:-}
      BACKUP_REPOSITORY_PATH: ${BACKUP_REPOSITORY_PATH:-hocx-borg}
      BACKUP_REMOTE_PATH: ${BACKUP_REMOTE_PATH:-borg-1.4}
      BACKUP_REPOSITORY_ID: ${BACKUP_REPOSITORY_ID:-}
      BACKUP_SSH_HOST_FINGERPRINT: ${BACKUP_SSH_HOST_FINGERPRINT:-}
      BACKUP_SSH_KEY_FILE: /run/secrets/backup_ssh_key
      BACKUP_PASSPHRASE_FILE: /run/secrets/backup_passphrase
      BACKUP_KNOWN_HOSTS_FILE: /run/secrets/backup_known_hosts
      BACKUP_WORK_DIR: /backup-work
      BACKUP_STAGING_MAX_BYTES: ${BACKUP_STAGING_MAX_BYTES:-21474836480}
      BACKUP_BATCH_MAX_BYTES: ${BACKUP_BATCH_MAX_BYTES:-2147483648}
      BACKUP_UPLOAD_RATELIMIT_KIB: ${BACKUP_UPLOAD_RATELIMIT_KIB:-0}
      BACKUP_COMPRESSION: ${BACKUP_COMPRESSION:-auto,zstd,3}
      BACKUP_STORAGEBOX_QUOTA_BYTES: ${BACKUP_STORAGEBOX_QUOTA_BYTES:-0}
      BACKUP_TRUST_FILESYSTEM_REGISTRY: ${BACKUP_TRUST_FILESYSTEM_REGISTRY:-false}
    secrets:
      - database_url
      - auth_secret
      - admin_auth_secret
      - storage_credentials_key
      - backup_ssh_key
      - backup_passphrase
      - backup_known_hosts
    volumes:
      # Borg-Cache, Security-Verzeichnis (Repository-Pinning, Replay-Schutz), Staging für den
      # Datenbank-Dump und das Restore-Journal - muss Neustarts überdauern.
      - ./backups/borg-work:/backup-work
      # Dateisystem-Generation 0 (vor der Erstmigration) und Copy-on-Write-Kopien darin.
      - ${HOCX_STORAGE_PATH:-./storage}:/app/storage
      - ${HOCX_STORAGE_PATH:-./storage}/abgabebox-uploads:/app/abgabebox-storage
      - ./storage-local/work:/app/storage-local/work
    networks:
      - default
      - storage
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      # Die Schleife erneuert die Datei mindestens alle paar Sekunden (auch während langer
      # Aufträge über den Lease-Heartbeat); 5 Minuten ohne Lebenszeichen = hängt.
      test: ["CMD", "python3", "-c", "import os, sys, time; sys.exit(0 if time.time() - os.path.getmtime('/tmp/hocx-backup-worker.alive') < 300 else 1)"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 120s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Dokument-Worker: PDF-Konvertierung (LibreOffice) und Textextraktion, Backend-Image. Verarbeitet
  # nicht vertrauenswürdige Dateien - read_only, ohne Capabilities, ohne Ports, knappes Budget.
  # Netz: default (Datenbank) und storage (lokales S3); bei einem externen S3-Profil braucht er
  # zusätzlich ausgehenden Zugang dorthin. LibreOffice selbst lädt keine externen Inhalte
  # (siehe app/services/documents/convert.py).
  document-worker:
    image: ${HOCX_BACKEND_IMAGE:-ghcr.io/${GHCR_NAMESPACE}/hocx-backend:${HOCX_VERSION}}
    restart: unless-stopped
    mem_limit: 1536m
    cpus: 1.0
    pids_limit: 256
    init: true
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    entrypoint: ["python", "-m", "app.workers.document_worker"]
    command: []
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,mode=1777
    environment:
      HOCX_ENVIRONMENT: ${HOCX_ENVIRONMENT:-production}
      # Keine Anmelde-/Admin-Secrets (app/core/config.py, SECRETLESS_PROCESS_KINDS).
      HOCX_PROCESS_KIND: document-worker
      APP_DATABASE_URL_FILE: /run/secrets/app_database_url
      PYTHONPATH: /app
      STORAGE_ROOT: /app/storage
      EXPORT_ROOT: /app/storage/exports
      UPLOAD_ROOT: /app/storage/uploads
      ABGABEBOX_STORAGE_ROOT: /app/abgabebox-storage
      STORAGE_CREDENTIALS_KEY_FILE: /run/secrets/storage_credentials_key
      STORAGE_WORK_ROOT: /app/storage-local/work
    # Nur die eingeschränkte App-Rolle (app/core/db.py nutzt APP_DATABASE_URL), nie die
    # Owner-URL, und keine AUTH_SECRET/ADMIN_AUTH_SECRET: der Dienst verarbeitet nicht
    # vertrauenswürdige Dateien.
    secrets:
      - app_database_url
      - storage_credentials_key
    volumes:
      - ${HOCX_STORAGE_PATH:-./storage}:/app/storage
      - ${HOCX_STORAGE_PATH:-./storage}/abgabebox-uploads:/app/abgabebox-storage
      - ./storage-local/work:/app/storage-local/work
    networks:
      - default
      - storage
    depends_on:
      backend:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  abgabebox-backend:
    image: ${HOCX_ABGABEBOX_BACKEND_IMAGE:-ghcr.io/${GHCR_NAMESPACE}/hocx-abgabebox-backend:${HOCX_VERSION}}
    restart: unless-stopped
    # Maximal eine aktive Upload-Anfrage pro Worker; Multipart-Tempdateien liegen auf Platte.
    mem_limit: 1024m
    cpus: 1.5
    init: true
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      ABGABEBOX_DATABASE_URL_FILE: /run/secrets/abgabebox_database_url
      ABGABEBOX_STORAGE_ROOT: /app/storage
      ABGABEBOX_CORS_ORIGIN: https://${TRAEFIK_ABGABEBOX_DOMAIN}
      # Zentrale Prüfseite (Weiterleitung von Mandanten-Prüf-Domains); leer = ABGABEBOX_CORS_ORIGIN/verify
      DOCUMENT_VERIFY_BASE_URL: ${DOCUMENT_VERIFY_BASE_URL:-}
      # Steuert, ob captcha.py bei fehlenden FriendlyCaptcha-Keys sicher ablehnt
      # (production) oder Uploads ohne Bot-Check zulaesst (dev/test) - siehe
      # abgabebox-backend/app/config.py:_DEV_LIKE_ENVIRONMENTS. HOCX_ENVIRONMENT ist
      # bereits die einzige Stelle, an der Test von Prod unterschieden wird.
      ABGABEBOX_ENVIRONMENT: ${HOCX_ENVIRONMENT:-production}
      FRIENDLY_CAPTCHA_SITEKEY: ${FRIENDLY_CAPTCHA_SITEKEY}
      FRIENDLY_CAPTCHA_API_KEY_FILE: /run/secrets/friendly_captcha_api_key
      ABGABEBOX_CAPTCHA_SESSION_SECRET_FILE: /run/secrets/abgabebox_captcha_session_secret
      CLAMAV_HOST: clamav
      CLAMAV_PORT: ${CLAMAV_PORT:-3310}
      FRIENDLY_CAPTCHA_VERIFY_URL: ${FRIENDLY_CAPTCHA_VERIFY_URL:-https://api.friendlycaptcha.com/api/v1/siteverify}
      ABGABEBOX_CAPTCHA_SESSION_TTL_MINUTES: ${ABGABEBOX_CAPTCHA_SESSION_TTL_MINUTES:-120}
      ABGABEBOX_TENANT_STORAGE_QUOTA_MB: ${ABGABEBOX_TENANT_STORAGE_QUOTA_MB:-2048}
      ABGABEBOX_MAX_FILES_PER_UPLOAD_REQUEST: ${ABGABEBOX_MAX_FILES_PER_UPLOAD_REQUEST:-50}
      ABGABEBOX_QUARANTINE_MAX_AGE_MINUTES: ${ABGABEBOX_QUARANTINE_MAX_AGE_MINUTES:-60}
      ABGABEBOX_QUARANTINE_CLEANUP_INTERVAL_MINUTES: ${ABGABEBOX_QUARANTINE_CLEANUP_INTERVAL_MINUTES:-5}
      STORAGE_CREDENTIALS_KEY_FILE: /run/secrets/storage_credentials_key
    secrets:
      - abgabebox_database_url
      - friendly_captcha_api_key
      - abgabebox_captcha_session_secret
      - storage_credentials_key
    networks:
      - default
      - storage
    depends_on:
      db:
        condition: service_healthy
      backend:
        condition: service_started
    volumes:
      # Multipart-Parser puffert grosse Dateien hier auf Platte, niemals im RAM.
      - abgabebox_upload_tmp:/tmp
      - ${HOCX_STORAGE_PATH:-./storage}/abgabebox-uploads:/app/storage
    healthcheck:
      # Kein curl im python:3.13-slim-Image (siehe Audit) - urllib aus der Stdlib genuegt fuer
      # einen simplen Liveness-Check gegen den Health-Endpoint aus app/main.py.
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.${ROUTER_PREFIX:-hocx}-abgabebox-backend.rule=Host(`${TRAEFIK_ABGABEBOX_DOMAIN}`) && PathPrefix(`/api`)"
      - "traefik.http.routers.${ROUTER_PREFIX:-hocx}-abgabebox-backend.middlewares=${ROUTER_PREFIX:-hocx}-api-inflight"
      - "traefik.http.routers.${ROUTER_PREFIX:-hocx}-abgabebox-backend.entrypoints=websecure"
      - "traefik.http.routers.${ROUTER_PREFIX:-hocx}-abgabebox-backend.tls.certresolver=${TRAEFIK_CERTRESOLVER:-letsencrypt}"
      - "traefik.http.routers.${ROUTER_PREFIX:-hocx}-abgabebox-backend.priority=100"
      - "traefik.http.routers.${ROUTER_PREFIX:-hocx}-abgabebox-backend.service=${ROUTER_PREFIX:-hocx}-abgabebox-backend"
      - "traefik.http.services.${ROUTER_PREFIX:-hocx}-abgabebox-backend.loadbalancer.server.port=8000"
      - "traefik.http.routers.${ROUTER_PREFIX:-hocx}-abgabebox-upload.rule=Host(`${TRAEFIK_ABGABEBOX_DOMAIN}`) && PathPrefix(`/api/public`) && Method(`POST`)"
      - "traefik.http.routers.${ROUTER_PREFIX:-hocx}-abgabebox-upload.entrypoints=websecure"
      - "traefik.http.routers.${ROUTER_PREFIX:-hocx}-abgabebox-upload.tls.certresolver=${TRAEFIK_CERTRESOLVER:-letsencrypt}"
      - "traefik.http.routers.${ROUTER_PREFIX:-hocx}-abgabebox-upload.priority=200"
      - "traefik.http.routers.${ROUTER_PREFIX:-hocx}-abgabebox-upload.service=${ROUTER_PREFIX:-hocx}-abgabebox-backend"
      - "traefik.http.routers.${ROUTER_PREFIX:-hocx}-abgabebox-upload.middlewares=${ROUTER_PREFIX:-hocx}-abgabebox-upload-ratelimit,${ROUTER_PREFIX:-hocx}-abgabebox-upload-inflight,${ROUTER_PREFIX:-hocx}-abgabebox-upload-body-limit"
      - "traefik.http.middlewares.${ROUTER_PREFIX:-hocx}-abgabebox-upload-ratelimit.ratelimit.average=30"
      - "traefik.http.middlewares.${ROUTER_PREFIX:-hocx}-abgabebox-upload-ratelimit.ratelimit.burst=10"
      - "traefik.http.middlewares.${ROUTER_PREFIX:-hocx}-abgabebox-upload-ratelimit.ratelimit.period=1m"
      # Audit A2, 2026-08-16: was missing here (present in docker-compose.yml, which is
      # what the regression test in abgabebox-backend/tests/test_upload_size_limits.py
      # actually checked, not this file - the file `deploy.sh` really uses). Without it,
      # Starlette buffers the whole request body for this unauthenticated public POST
      # endpoint before the app-level size check ever runs. Lowered from 2000 MB (audit
      # finding, 2026-08-25) - routes/public.py's upload() holds every file's full content
      # in memory at once, and 2000 MB reliably OOM-kills the abgabebox-backend container
      # (mem_limit damals 384m, heute 1024m, 2 workers) for every tenant at once. Keep in sync with
      # MAX_UPLOAD_REQUEST_BYTES in abgabebox-backend/app/routes/public.py.
      - "traefik.http.middlewares.${ROUTER_PREFIX:-hocx}-abgabebox-upload-body-limit.buffering.maxRequestBodyBytes=158334976"
      - "traefik.http.middlewares.${ROUTER_PREFIX:-hocx}-abgabebox-upload-inflight.inflightreq.amount=2"
      - "traefik.http.middlewares.${ROUTER_PREFIX:-hocx}-abgabebox-public-ratelimit.ratelimit.average=60"
      - "traefik.http.middlewares.${ROUTER_PREFIX:-hocx}-abgabebox-public-ratelimit.ratelimit.burst=20"
      - "traefik.http.middlewares.${ROUTER_PREFIX:-hocx}-abgabebox-public-ratelimit.ratelimit.period=1m"
      - "traefik.http.routers.${ROUTER_PREFIX:-hocx}-abgabebox-public-get.rule=Host(`${TRAEFIK_ABGABEBOX_DOMAIN}`) && PathPrefix(`/api/public`) && Method(`GET`)"
      - "traefik.http.routers.${ROUTER_PREFIX:-hocx}-abgabebox-public-get.entrypoints=websecure"
      - "traefik.http.routers.${ROUTER_PREFIX:-hocx}-abgabebox-public-get.tls.certresolver=${TRAEFIK_CERTRESOLVER:-letsencrypt}"
      - "traefik.http.routers.${ROUTER_PREFIX:-hocx}-abgabebox-public-get.priority=200"
      - "traefik.http.routers.${ROUTER_PREFIX:-hocx}-abgabebox-public-get.service=${ROUTER_PREFIX:-hocx}-abgabebox-backend"
      - "traefik.http.routers.${ROUTER_PREFIX:-hocx}-abgabebox-public-get.middlewares=${ROUTER_PREFIX:-hocx}-abgabebox-public-ratelimit,${ROUTER_PREFIX:-hocx}-api-inflight"
      # Echtheitsprüfung (POST /api/public/verify): eigener Router VOR dem Upload-Router, eigenes
      # Rate-Limit und 4 KiB Body-Limit (nur Hash plus optionale Dokument-ID).
      - "traefik.http.routers.${ROUTER_PREFIX:-hocx}-abgabebox-verify.rule=Host(`${TRAEFIK_ABGABEBOX_DOMAIN}`) && Path(`/api/public/verify`) && Method(`POST`)"
      - "traefik.http.routers.${ROUTER_PREFIX:-hocx}-abgabebox-verify.entrypoints=websecure"
      - "traefik.http.routers.${ROUTER_PREFIX:-hocx}-abgabebox-verify.tls.certresolver=${TRAEFIK_CERTRESOLVER:-letsencrypt}"
      - "traefik.http.routers.${ROUTER_PREFIX:-hocx}-abgabebox-verify.priority=300"
      - "traefik.http.routers.${ROUTER_PREFIX:-hocx}-abgabebox-verify.service=${ROUTER_PREFIX:-hocx}-abgabebox-backend"
      - "traefik.http.routers.${ROUTER_PREFIX:-hocx}-abgabebox-verify.middlewares=${ROUTER_PREFIX:-hocx}-abgabebox-verify-ratelimit,${ROUTER_PREFIX:-hocx}-abgabebox-verify-body-limit"
      - "traefik.http.middlewares.${ROUTER_PREFIX:-hocx}-abgabebox-verify-ratelimit.ratelimit.average=30"
      - "traefik.http.middlewares.${ROUTER_PREFIX:-hocx}-abgabebox-verify-ratelimit.ratelimit.burst=10"
      - "traefik.http.middlewares.${ROUTER_PREFIX:-hocx}-abgabebox-verify-ratelimit.ratelimit.period=1m"
      - "traefik.http.middlewares.${ROUTER_PREFIX:-hocx}-abgabebox-verify-body-limit.buffering.maxRequestBodyBytes=4096"

  abgabebox-frontend:
    image: ${HOCX_ABGABEBOX_FRONTEND_IMAGE:-ghcr.io/${GHCR_NAMESPACE}/hocx-abgabebox-frontend:${HOCX_VERSION}}
    restart: unless-stopped
    # Raised 2026-09-02 alongside the other services now that the host has 16GB/8 cores.
    mem_limit: 1024m
    cpus: 1.0
    init: true
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,mode=1777
      - /app/.next/cache:rw,noexec,nosuid,nodev,uid=1000,gid=1000,mode=0750
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      NEXT_PUBLIC_ABGABEBOX_API_URL: https://${TRAEFIK_ABGABEBOX_DOMAIN}
      INTERNAL_ABGABEBOX_API_URL: https://${TRAEFIK_ABGABEBOX_DOMAIN}
      NEXT_PUBLIC_FRIENDLY_CAPTCHA_SITEKEY: ${FRIENDLY_CAPTCHA_SITEKEY}
    depends_on:
      - abgabebox-backend
    healthcheck:
      # Kein curl/wget im Release-Image, siehe frontend oben.
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/', res => process.exit(res.statusCode < 500 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.${ROUTER_PREFIX:-hocx}-abgabebox-frontend.rule=Host(`${TRAEFIK_ABGABEBOX_DOMAIN}`)"
      - "traefik.http.routers.${ROUTER_PREFIX:-hocx}-abgabebox-frontend.middlewares=${ROUTER_PREFIX:-hocx}-web-inflight"
      - "traefik.http.routers.${ROUTER_PREFIX:-hocx}-abgabebox-frontend.entrypoints=websecure"
      - "traefik.http.routers.${ROUTER_PREFIX:-hocx}-abgabebox-frontend.tls.certresolver=${TRAEFIK_CERTRESOLVER:-letsencrypt}"
      - "traefik.http.routers.${ROUTER_PREFIX:-hocx}-abgabebox-frontend.priority=10"
      - "traefik.http.services.${ROUTER_PREFIX:-hocx}-abgabebox-frontend.loadbalancer.server.port=3000"

  # Audit I8, 2026-08-16: was missing here (present in docker-compose.yml/dev) - a real
  # prod server set up per RUNBOOK.md section 6 (docker-compose.release.yml, no source
  # checkout needed) would have had no docs page at all, with nothing noting that as
  # intentional. Image is built by the same release workflow as the other services now
  # (.github/workflows/release.yml).
  docs:
    image: ${HOCX_DOCS_IMAGE:-ghcr.io/${GHCR_NAMESPACE}/hocx-docs:${HOCX_VERSION}}
    restart: unless-stopped
    # Static nginx, genuinely lightweight - small bump 2026-09-02 for margin, not because
    # of any observed problem here.
    mem_limit: 256m
    cpus: 0.25
    init: true
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,mode=1777
      - /var/cache/nginx:rw,noexec,nosuid,nodev,mode=1777
      - /var/run:rw,noexec,nosuid,nodev,mode=1777
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      # 127.0.0.1 statt localhost: nginx' Config listet nur "listen 80;" (IPv4).
      # Der offizielle Entrypoint wuerde das um "listen [::]:80;" ergaenzen, kann die
      # Config aber wegen read_only:true nicht patchen ("read-only file system?" im
      # Log) - wget wuerde "localhost" sonst zuerst als ::1 aufloesen und mit
      # Connection refused scheitern, obwohl nginx auf IPv4 laeuft.
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.${ROUTER_PREFIX:-hocx}-docs.rule=Host(`${TRAEFIK_DOCS_DOMAIN}`)"
      - "traefik.http.routers.${ROUTER_PREFIX:-hocx}-docs.entrypoints=websecure"
      - "traefik.http.routers.${ROUTER_PREFIX:-hocx}-docs.tls.certresolver=${TRAEFIK_CERTRESOLVER:-letsencrypt}"
      - "traefik.http.routers.${ROUTER_PREFIX:-hocx}-docs.priority=10"
      - "traefik.http.services.${ROUTER_PREFIX:-hocx}-docs.loadbalancer.server.port=80"

networks:
  # Siehe docker-socket-proxy: internes Netz nur zwischen Backend und Proxy.
  docker-api:
    internal: true
  # Siehe redis: internes Netz nur zwischen Backend und Redis.
  cache:
    internal: true
  storage:
    internal: true

volumes:
  backend_upload_tmp:
  abgabebox_upload_tmp:
  postgres_data:
  local_s3_data:

secrets:
  # file: statt environment: - Compose kann environment-Secrets seit Docker Compose
  # v5.5.0 nicht mehr in einen read_only-Service einhaengen ("cannot create secret ...
  # in read-only service: `file` is the sole supported option"), betrifft sowohl
  # `up` als auch `run`. deploy.sh schreibt diese Dateien vor jedem Start frisch aus
  # der aktuell geladenen .env nach .secrets/ (chmod 700/600, nicht committed).
  postgres_password:
    file: ${HOCX_SECRETS_DIR:-./.secrets}/postgres_password
  database_url:
    file: ${HOCX_SECRETS_DIR:-./.secrets}/database_url
  app_database_url:
    file: ${HOCX_SECRETS_DIR:-./.secrets}/app_database_url
  app_db_password:
    file: ${HOCX_SECRETS_DIR:-./.secrets}/app_db_password
  auth_secret:
    file: ${HOCX_SECRETS_DIR:-./.secrets}/auth_secret
  admin_auth_secret:
    file: ${HOCX_SECRETS_DIR:-./.secrets}/admin_auth_secret
  initial_admin_password:
    file: ${HOCX_SECRETS_DIR:-./.secrets}/initial_admin_password
  abgabebox_db_password:
    file: ${HOCX_SECRETS_DIR:-./.secrets}/abgabebox_db_password
  abgabebox_database_url:
    file: ${HOCX_SECRETS_DIR:-./.secrets}/abgabebox_database_url
  photo_worker_db_password:
    file: ${HOCX_SECRETS_DIR:-./.secrets}/photo_worker_db_password
  photo_worker_database_url:
    file: ${HOCX_SECRETS_DIR:-./.secrets}/photo_worker_database_url
  friendly_captcha_api_key:
    file: ${HOCX_SECRETS_DIR:-./.secrets}/friendly_captcha_api_key
  abgabebox_captcha_session_secret:
    file: ${HOCX_SECRETS_DIR:-./.secrets}/abgabebox_captcha_session_secret
  storage_credentials_key:
    file: ${HOCX_SECRETS_DIR:-./.secrets}/storage_credentials_key
  garage_rpc_secret:
    file: ${HOCX_SECRETS_DIR:-./.secrets}/garage_rpc_secret
  garage_admin_token:
    file: ${HOCX_SECRETS_DIR:-./.secrets}/garage_admin_token
  local_s3_secret_key:
    file: ${HOCX_SECRETS_DIR:-./.secrets}/local_s3_secret_key
  local_s3_abgabebox_secret_key:
    file: ${HOCX_SECRETS_DIR:-./.secrets}/local_s3_abgabebox_secret_key
  redis_password:
    file: ${HOCX_SECRETS_DIR:-./.secrets}/redis_password
  # Backup (deploy.sh schreibt leere Platzhalter, solange nichts konfiguriert ist).
  backup_ssh_key:
    file: ${HOCX_SECRETS_DIR:-./.secrets}/backup_ssh_key
  backup_passphrase:
    file: ${HOCX_SECRETS_DIR:-./.secrets}/backup_passphrase
  backup_known_hosts:
    file: ${HOCX_SECRETS_DIR:-./.secrets}/backup_known_hosts
