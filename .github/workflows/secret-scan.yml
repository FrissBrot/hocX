name: Secret scan

on:
  push:
    branches: [main, version-1.1]
  pull_request:
    branches: [main, version-1.1]

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:latest detect \
            --source /repo --config /repo/.gitleaks.toml --redact --exit-code 1 -v
