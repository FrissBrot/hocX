name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  deploy-script-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Test secure env loader and shell syntax
        run: |
          bash -n scripts/lib/env.sh scripts/lib/cosign.sh scripts/lib/github.sh scripts/deploy.sh scripts/dev.sh scripts/e2e.sh scripts/test.sh scripts/provision_deploy_user.sh scripts/update_deploy_code.sh scripts/verify_release.sh scripts/record_tested_candidate.sh scripts/backup_db.sh scripts/tests/*.sh
          bash scripts/tests/test_env.sh
          bash scripts/tests/test_release_config.sh

  migration-check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: hocx_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt

      - name: Run alembic upgrade head against a fresh database
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg://ci:ci@localhost:5432/hocx_ci
          # The baseline migration (0001_initial_schema) reads these directly via
          # os.environ - without them it either fails outright (ABGABEBOX_DB_PASSWORD has
          # no default) or silently GRANTs on the wrong database name (POSTGRES_DB
          # defaults to "hocx", but the CI database here is "hocx_ci"). The postgres
          # service container's own POSTGRES_DB/POSTGRES_PASSWORD env (above) only
          # configures that container, it is not inherited by this step.
          POSTGRES_DB: hocx_ci
          APP_DB_PASSWORD: ci-migration-check-dummy-app-password
          ABGABEBOX_DB_PASSWORD: ci-migration-check-dummy-abgabebox-password
          AUTH_SECRET: ci-migration-check-dummy-secret-0123456789
          ADMIN_AUTH_SECRET: ci-migration-check-dummy-admin-secret-0123456789
        run: python3 -m alembic upgrade head

  backend-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: hocx_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      # app/core/rate_limit.py's check_account_lockout (login, MFA, tenant-by-domain
      # lookups etc.) needs a real Redis - without it every test that logs in fails with
      # a connection error, not a rate-limit-logic error.
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install backend dependencies
        run: pip install -r backend/requirements-dev.txt

      # PDF export tests exercise the real LaTeX toolchain, same packages as
      # backend/Dockerfile(.test) - ubuntu-latest doesn't have these preinstalled.
      - name: Install LaTeX toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            texlive-latex-base \
            texlive-latex-recommended \
            texlive-fonts-recommended \
            texlive-xetex \
            texlive-pictures \
            fonts-lmodern

      - name: Run alembic upgrade head against a fresh database
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg://ci:ci@localhost:5432/hocx_ci
          POSTGRES_DB: hocx_ci
          APP_DB_PASSWORD: ci-backend-tests-dummy-app-password
          ABGABEBOX_DB_PASSWORD: ci-backend-tests-dummy-abgabebox-password
          AUTH_SECRET: ci-backend-tests-dummy-secret-0123456789
          ADMIN_AUTH_SECRET: ci-backend-tests-dummy-admin-secret-0123456789
        run: python3 -m alembic -x seed_demo=true upgrade head

      - name: Run pytest
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg://ci:ci@localhost:5432/hocx_ci
          REDIS_URL: redis://localhost:6379/0
          AUTH_SECRET: ci-backend-tests-dummy-secret-0123456789
          ADMIN_AUTH_SECRET: ci-backend-tests-dummy-admin-secret-0123456789
          # These all default to /app/... (docker-compose.yml's WORKDIR), which doesn't
          # exist on a bare runner and can't be created by the unprivileged runner user
          # either - PDF export tests need the real committed tenant-1 templates, not just
          # a writable empty dir, so these point at the actual checked-out storage/ tree.
          # Must be absolute: pdflatex runs with -cnf-line=openin_any=p (export_service.py) -
          # its "paranoid" file-access mode rejects any path containing a '..' component,
          # which a relative override (e.g. "../storage") would be once combined with the
          # export's own subdirectory.
          STORAGE_ROOT: ${{ github.workspace }}/storage
          LATEX_TEMPLATE_ROOT: ${{ github.workspace }}/storage/latex_templates
          EXPORT_ROOT: ${{ github.workspace }}/storage/exports
          UPLOAD_ROOT: ${{ github.workspace }}/storage/uploads
        # No coverage threshold gate: per hocX.wiki/Bekannte-offene-Punkte, meaningful
        # domain/security test cases matter more than a bare percentage. This is purely
        # for visibility into which areas have no test coverage at all.
        run: python3 -m pytest tests/ -v --cov=app --cov-report=term-missing

      - name: Audit-log coverage report (informational)
        working-directory: backend
        run: python3 scripts/check_audit_coverage.py

  abgabebox-backend-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: hocx_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install backend and Abgabebox test dependencies
        run: |
          pip install -r backend/requirements.txt
          pip install -r abgabebox-backend/requirements-dev.txt

      - name: Prepare database schema and restricted Abgabebox role
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg://ci:ci@localhost:5432/hocx_ci
          POSTGRES_DB: hocx_ci
          APP_DB_PASSWORD: ci-abgabebox-tests-app-password
          ABGABEBOX_DB_PASSWORD: ci-abgabebox-tests-password
          AUTH_SECRET: ci-abgabebox-tests-dummy-secret-0123456789
          ADMIN_AUTH_SECRET: ci-abgabebox-tests-dummy-admin-secret-0123456789
        run: python3 -m alembic -x seed_demo=true upgrade head

      - name: Run Abgabebox backend tests
        working-directory: abgabebox-backend
        env:
          ABGABEBOX_DATABASE_URL: postgresql+psycopg://hocx_abgabebox:ci-abgabebox-tests-password@localhost:5432/hocx_ci
          ABGABEBOX_CAPTCHA_SESSION_SECRET: ci-abgabebox-captcha-secret-0123456789
          # Defaults to /app/storage (docker-compose.yml overrides it for the real
          # container) - doesn't exist on a bare runner and the unprivileged runner user
          # can't create it either. Only needs to be writable, unlike the main backend's
          # LATEX_TEMPLATE_ROOT, so any real path works - absolute to match that job's
          # reasoning for the same class of variable rather than for a concrete need here.
          ABGABEBOX_STORAGE_ROOT: ${{ github.workspace }}/storage/abgabebox-uploads
        run: python3 -m pytest tests/ -v --cov=app --cov-report=term-missing

  frontend-build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [frontend, abgabebox-frontend]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ${{ matrix.app }}/package-lock.json

      - name: Install dependencies
        working-directory: ${{ matrix.app }}
        run: npm ci

      - name: Test
        # Audit A5, 2026-08-16: both apps have a `test` script (frontend already had one
        # with 3 test files, abgabebox-frontend's is new) but neither was ever actually run
        # in CI before this - tests only guard against regressions if something runs them.
        working-directory: ${{ matrix.app }}
        run: npm test -- --coverage

      - name: Build
        working-directory: ${{ matrix.app }}
        run: npm run build

  e2e-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Playwright
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run isolated Playwright stack and browser tests
        env:
          CI: "true"
          E2E_USE_HOST_PLAYWRIGHT: "1"
        run: ./scripts/e2e.sh all

      - name: Upload Playwright diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/playwright/
          if-no-files-found: ignore
          retention-days: 14


  # Non-blocking vulnerability check for Python and Node dependencies.
  # The repo currently carries known, not-yet-fixed high-severity findings
  # (Next.js, python-multipart, starlette - tracked separately for a fix),
  # so this job must never fail the PR check. Instead every step uses
  # continue-on-error and writes its findings to the job summary, so new
  # vulnerabilities stay visible without turning every PR red.
  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install pip-audit
        run: pip install pip-audit

      # Audit backend Python dependencies. continue-on-error: true because
      # known high-severity findings (starlette, python-multipart) already
      # exist and are tracked/fixed separately - this must warn, not block.
      - name: Audit backend/requirements.txt (pip-audit)
        continue-on-error: true
        run: |
          echo "## pip-audit: backend/requirements.txt" >> "$GITHUB_STEP_SUMMARY"
          pip-audit -r backend/requirements.txt -f markdown >> "$GITHUB_STEP_SUMMARY" || true

      # Audit abgabebox-backend Python dependencies, same non-blocking policy.
      - name: Audit abgabebox-backend/requirements.txt (pip-audit)
        continue-on-error: true
        run: |
          echo "## pip-audit: abgabebox-backend/requirements.txt" >> "$GITHUB_STEP_SUMMARY"
          pip-audit -r abgabebox-backend/requirements.txt -f markdown >> "$GITHUB_STEP_SUMMARY" || true

      # Audit frontend Node dependencies. Known high-severity Next.js finding
      # is tracked separately, so this warns via the summary instead of
      # failing the build.
      - name: Audit frontend (npm audit)
        continue-on-error: true
        working-directory: frontend
        run: |
          echo "## npm audit: frontend" >> "$GITHUB_STEP_SUMMARY"
          npm audit --audit-level=high || true
          npm audit --audit-level=high --json > audit-result.json || true
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat audit-result.json >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      # Audit abgabebox-frontend Node dependencies, same non-blocking policy.
      - name: Audit abgabebox-frontend (npm audit)
        continue-on-error: true
        working-directory: abgabebox-frontend
        run: |
          echo "## npm audit: abgabebox-frontend" >> "$GITHUB_STEP_SUMMARY"
          npm audit --audit-level=high || true
          npm audit --audit-level=high --json > audit-result.json || true
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat audit-result.json >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  # Scans the PR diff for accidentally committed secrets. Unlike
  # dependency-audit this job is a hard gate (no continue-on-error): a newly
  # committed secret must block the merge, not just warn.
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      # gitleaks needs both the base and head commit of the PR to diff
      # against, so fetch-depth: 0 is required here (unlike the other jobs,
      # which only need the checked-out tree).
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # gitleaks/gitleaks-action: free, no license/API key needed for the
      # standard (non-Organization) usage in a private repo - it runs the
      # open-source gitleaks scanner locally in the runner. Scoped to the
      # PR's own commit range via GITLEAKS_CONFIG defaults (base/head from
      # the pull_request event), not the full repo history.
      - name: Run gitleaks secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
