name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# security-audit DEPLOY-01: no job here needs more than read access; explicit beats the
# repository-default fallback so a future job can't silently inherit broader rights.
permissions:
  contents: read

jobs:
  deploy-script-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Shellcheck
        # shellcheck ist auf ubuntu-latest vorinstalliert (MAIN-OPS-011).
        run: shellcheck $(git ls-files '*.sh') .githooks/pre-commit

      - name: Test secure env loader and shell syntax
        run: |
          bash -n scripts/*.sh scripts/lib/*.sh scripts/tests/*.sh .githooks/pre-commit
          bash scripts/tests/test_env.sh
          bash scripts/tests/test_release_config.sh
          python3 -m unittest discover -s scripts/tests -p "test_release_notes.py"
          python3 -m unittest discover -s scripts/tests -p "test_security_rules.py"
          bash scripts/tests/test_env_migrate.sh
          bash scripts/tests/test_run_job.sh
          bash scripts/tests/test_backup_restore.sh
          bash scripts/tests/test_legacy_backup_guard.sh
          bash scripts/sync-design-tokens.sh --check
          python3 scripts/check-design-rules.py

      # Elementtypen (id, Code, Render-Typ, Fähigkeiten) kommen ausschliesslich aus
      # element-types/registry.json - die generierten Dateien in frontend/ und backend/ müssen
      # dazu passen.
      - name: Elementtyp-Registry ist aktuell generiert
        run: python3 scripts/sync-element-types.py --check

      # i18n (siehe CLAUDE.md, Abschnitt "Internationalisierung / i18n"): alle drei Checks
      # beziehen die unterstuetzten Sprachen ausschliesslich aus i18n/locales.json - eine neu
      # registrierte Sprache wird hier automatisch erkannt, ohne dass dieser Workflow angepasst
      # werden muss.
      - name: i18n - zentrale Locale-Konfiguration ist aktuell generiert
        run: python3 scripts/sync-i18n-config.py --check

      - name: i18n - Translation Catalogs vollstaendig
        run: python3 scripts/check-i18n-completeness.py

      - name: i18n - keine neuen hart codierten UI-Texte
        run: python3 scripts/check-i18n-hardcoded-text.py

      - name: i18n - t()-Aufrufe loesen existierende Keys auf
        run: python3 scripts/check-i18n-key-resolution.py

      # Dokument-Engine: Typst-Tokens kommen aus design/tokens.css, die festen PDF-Texte aus
      # frontend/messages/*/documentPdf.json - beide Kopien im Backend werden nie von Hand
      # bearbeitet.
      - name: Dokument-Engine - Typst-Tokens aktuell generiert
        run: python3 scripts/sync-document-tokens.py --check

      - name: Dokument-Engine - PDF-Texte aktuell kopiert
        run: python3 scripts/sync-document-i18n.py --check

  migration-check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: hocx_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt

      - name: Run alembic upgrade head against a fresh database
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg://ci:ci@localhost:5432/hocx_ci
          # The baseline migration (0001_initial_schema) reads these directly via
          # os.environ - without them it either fails outright (ABGABEBOX_DB_PASSWORD has
          # no default) or silently GRANTs on the wrong database name (POSTGRES_DB
          # defaults to "hocx", but the CI database here is "hocx_ci"). The postgres
          # service container's own POSTGRES_DB/POSTGRES_PASSWORD env (above) only
          # configures that container, it is not inherited by this step.
          POSTGRES_DB: hocx_ci
          APP_DB_PASSWORD: ci-migration-check-dummy-app-password
          ABGABEBOX_DB_PASSWORD: ci-migration-check-dummy-abgabebox-password
          PHOTO_WORKER_DB_PASSWORD: ci-migration-check-dummy-photo-worker-password
          AUTH_SECRET: ci-migration-check-dummy-secret-0123456789
          ADMIN_AUTH_SECRET: ci-migration-check-dummy-admin-secret-0123456789
        run: python3 -m alembic upgrade head

  backend-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: hocx_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      # app/core/rate_limit.py's check_account_lockout (login, MFA, tenant-by-domain
      # lookups etc.) needs a real Redis - without it every test that logs in fails with
      # a connection error, not a rate-limit-logic error.
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install backend dependencies
        run: pip install -r backend/requirements-dev.txt

      # Die Dokument-Engine rendert mit Typst (Python-Paket, Schriften im Repo); die Tests
      # lesen erzeugte PDFs mit pdftotext/pdfinfo aus - wie backend/Dockerfile.test.
      - name: Install PDF test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends poppler-utils

      # Backup-Tests (tests/test_backup_*.py) brauchen borg 1.4 - Ubuntu liefert nur 1.2, auf PyPI
      # gibt es keine Wheels. Scheitert der Build, werden diese Tests übersprungen (requires_borg)
      # statt die CI zu blockieren; vollständig laufen sie im Backend-Testimage (scripts/test.sh).
      - name: Install BorgBackup 1.4 for backup tests
        run: |
          sudo apt-get install -y --no-install-recommends libacl1-dev liblz4-dev libzstd-dev libxxhash-dev libssl-dev pkg-config \
            && pip install "borgbackup==1.4.1" \
            || echo "borg 1.4 nicht installiert - Borg-Tests werden übersprungen"

      # Backup-Tests (tests/test_backup_*.py) brauchen borg 1.4 - Ubuntu liefert nur 1.2, auf PyPI
      # gibt es keine Wheels. Scheitert der Build, werden diese Tests übersprungen (requires_borg)
      # statt die CI zu blockieren; vollständig laufen sie im Backend-Testimage (scripts/test.sh).
      - name: Install BorgBackup 1.4 for backup tests
        run: |
          sudo apt-get install -y --no-install-recommends libacl1-dev liblz4-dev libzstd-dev libxxhash-dev libssl-dev pkg-config \
            && pip install "borgbackup==1.4.1" \
            || echo "borg 1.4 nicht installiert - Borg-Tests werden übersprungen"

      # Dokumentverarbeitung (tests/test_document_*.py): LibreOffice, Tesseract und Poppler wie
      # in backend/Dockerfile(.test) - ohne sie würden Konvertierung, OCR und Vorschau übersprungen.
      - name: Install document toolchain
        run: |
          sudo apt-get install -y --no-install-recommends \
            libreoffice-writer-nogui \
            libreoffice-calc-nogui \
            libreoffice-impress-nogui \
            tesseract-ocr \
            tesseract-ocr-deu \
            tesseract-ocr-fra \
            tesseract-ocr-ita \
            poppler-utils \
            fonts-liberation \
            fonts-dejavu-core \
            fonts-crosextra-carlito \
            fonts-crosextra-caladea

      - name: Run alembic upgrade head against a fresh database
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg://ci:ci@localhost:5432/hocx_ci
          POSTGRES_DB: hocx_ci
          APP_DB_PASSWORD: ci-backend-tests-dummy-app-password
          ABGABEBOX_DB_PASSWORD: ci-backend-tests-dummy-abgabebox-password
          PHOTO_WORKER_DB_PASSWORD: ci-backend-tests-dummy-photo-worker-password
          AUTH_SECRET: ci-backend-tests-dummy-secret-0123456789
          ADMIN_AUTH_SECRET: ci-backend-tests-dummy-admin-secret-0123456789
        run: python3 -m alembic -x seed_demo=true upgrade head

      - name: Run pytest
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg://ci:ci@localhost:5432/hocx_ci
          REDIS_URL: redis://localhost:6379/0
          AUTH_SECRET: ci-backend-tests-dummy-secret-0123456789
          ADMIN_AUTH_SECRET: ci-backend-tests-dummy-admin-secret-0123456789
          # Speicherprofile verschlüsseln Zugangsdaten damit (mind. 32 Zeichen, wie docker-compose.tests.yml).
          STORAGE_CREDENTIALS_KEY: ci-backend-tests-dummy-storage-key-0123456789
          # These all default to /app/... (docker-compose.yml's WORKDIR), which doesn't
          # exist on a bare runner and can't be created by the unprivileged runner user
          # either, so they point at the checked-out storage/ tree (absolute paths).
          STORAGE_ROOT: ${{ github.workspace }}/storage
          EXPORT_ROOT: ${{ github.workspace }}/storage/exports
          UPLOAD_ROOT: ${{ github.workspace }}/storage/uploads
          # Defaults to /app/storage-local/thumbnails (same unwritable-on-a-runner problem
          # as above) - only needs to be a writable absolute path, created on demand.
          THUMBNAIL_ROOT: ${{ github.workspace }}/storage-local/thumbnails
          # Same for the Traefik dynamic-config dir (default /app/traefik_dynamic) that the
          # app lifespan writes on startup (tests/test_app_lifespan_smoke.py).
          TRAEFIK_DYNAMIC_CONFIG_DIR: ${{ runner.temp }}/traefik_dynamic
          # Dokument-Engine: Golden-Diffs und Galerie als Artefakte (siehe Upload-Schritte).
          DOCUMENT_GOLDEN_DIFF_DIR: ${{ runner.temp }}/document-golden-diffs
          DOCUMENT_GALLERY_OUT: ${{ runner.temp }}/document-gallery.pdf
        # No coverage threshold gate: per hocX.wiki/Bekannte-offene-Punkte, meaningful
        # domain/security test cases matter more than a bare percentage. This is purely
        # for visibility into which areas have no test coverage at all.
        run: python3 -m pytest tests/ -v --cov=app --cov-report=term-missing

      - name: Audit-log coverage report (informational)
        working-directory: backend
        run: python3 scripts/check_audit_coverage.py

      # Jede Fachkomponente hat Modell, Provider, Basis-Komponente und Texte, jeder Eintrag des
      # Document Studio (Knotentypen, Bibliothek, Bindungen, Systemvorlagen) seine Labels;
      # Typst-Pakete sind vendored (der Compile greift nie aufs Netz).
      - name: Dokument-Engine - Katalog vollstaendig
        env:
          DATABASE_URL: postgresql+psycopg://ci:ci@localhost:5432/hocx_ci
          AUTH_SECRET: ci-backend-tests-dummy-secret-0123456789
          ADMIN_AUTH_SECRET: ci-backend-tests-dummy-admin-secret-0123456789
        run: python3 scripts/check-document-catalog.py

      # Visuelle Regression: bei Abweichungen Ist- und Differenzbilder zum Ansehen.
      - name: Upload document golden diffs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: document-golden-diffs
          path: ${{ runner.temp }}/document-golden-diffs
          if-no-files-found: ignore

      # Galerie «alle Systemvorlagen mit Beispieldaten» (entsteht im pytest-Lauf oben).
      - name: Upload document gallery
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: document-gallery
          path: ${{ runner.temp }}/document-gallery.pdf
          if-no-files-found: ignore

  abgabebox-backend-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: hocx_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            abgabebox-backend/requirements-dev.txt

      - name: Install backend and Abgabebox test dependencies
        run: |
          pip install -r backend/requirements.txt
          pip install -r abgabebox-backend/requirements-dev.txt

      - name: Prepare database schema and restricted Abgabebox role
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg://ci:ci@localhost:5432/hocx_ci
          POSTGRES_DB: hocx_ci
          APP_DB_PASSWORD: ci-abgabebox-tests-app-password
          ABGABEBOX_DB_PASSWORD: ci-abgabebox-tests-password
          PHOTO_WORKER_DB_PASSWORD: ci-abgabebox-tests-photo-worker-password
          AUTH_SECRET: ci-abgabebox-tests-dummy-secret-0123456789
          ADMIN_AUTH_SECRET: ci-abgabebox-tests-dummy-admin-secret-0123456789
        run: python3 -m alembic -x seed_demo=true upgrade head

      - name: Run Abgabebox backend tests
        working-directory: abgabebox-backend
        env:
          ABGABEBOX_DATABASE_URL: postgresql+psycopg://hocx_abgabebox:ci-abgabebox-tests-password@localhost:5432/hocx_ci
          ABGABEBOX_CAPTCHA_SESSION_SECRET: ci-abgabebox-captcha-secret-0123456789
          # Defaults to /app/storage (docker-compose.yml overrides it for the real
          # container) - doesn't exist on a bare runner and the unprivileged runner user
          # can't create it either. Only needs to be writable, so any real path works -
          # absolute to match the backend job's storage variables.
          ABGABEBOX_STORAGE_ROOT: ${{ github.workspace }}/storage/abgabebox-uploads
        run: python3 -m pytest tests/ -v --cov=app --cov-report=term-missing

  photo-analysis-worker-tests:
    runs-on: ubuntu-latest
    # tests/test_db.py/test_worker.py exercise the worker's restricted hocx_photo_worker
    # role against a real, migrated schema (same as docker-compose.tests.yml's test-db),
    # so this job needs Postgres + the backend migrations like abgabebox-backend-tests.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: hocx_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            photo-analysis-worker/requirements-dev.txt

      - name: Install backend and photo-analysis-worker dependencies
        run: |
          pip install -r backend/requirements.txt
          pip install -r photo-analysis-worker/requirements-dev.txt

      - name: Prepare database schema and restricted photo-worker role
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg://ci:ci@localhost:5432/hocx_ci
          POSTGRES_DB: hocx_ci
          APP_DB_PASSWORD: ci-photo-worker-tests-app-password
          ABGABEBOX_DB_PASSWORD: ci-photo-worker-tests-abgabebox-password
          PHOTO_WORKER_DB_PASSWORD: ci-photo-worker-tests-password
          AUTH_SECRET: ci-photo-worker-tests-dummy-secret-0123456789
          ADMIN_AUTH_SECRET: ci-photo-worker-tests-dummy-admin-secret-0123456789
        run: python3 -m alembic upgrade head

      # Same pinned, hash-verified download as the Dockerfile/Dockerfile.test - see their
      # comments.
      - name: Download face detection model
        env:
          YUNET_MODEL_URL: https://github.com/opencv/opencv_zoo/raw/main/models/face_detection_yunet/face_detection_yunet_2026may.onnx
          YUNET_MODEL_SHA256: ebafce4e3c118d6554634be5c27ab333b4c047a9a8c3faf1d7cf93101c22f0f0
        run: |
          set -euo pipefail
          mkdir -p "${{ github.workspace }}/models"
          python3 -c "
          import hashlib, os, urllib.request
          url, expected_sha256 = os.environ['YUNET_MODEL_URL'], os.environ['YUNET_MODEL_SHA256']
          data = urllib.request.urlopen(url, timeout=30).read()
          actual_sha256 = hashlib.sha256(data).hexdigest()
          assert actual_sha256 == expected_sha256, f'YuNet model SHA-256 mismatch: expected {expected_sha256}, got {actual_sha256}'
          open('${{ github.workspace }}/models/face_detection_yunet.onnx', 'wb').write(data)
          "

      - name: Run pytest
        working-directory: photo-analysis-worker
        env:
          PHOTO_WORKER_MODEL_PATH: ${{ github.workspace }}/models/face_detection_yunet.onnx
          PHOTO_WORKER_DATABASE_URL: postgresql+psycopg://hocx_photo_worker:ci-photo-worker-tests-password@localhost:5432/hocx_ci
          TEST_ADMIN_DATABASE_URL: postgresql+psycopg://hocx_app:ci-photo-worker-tests-app-password@localhost:5432/hocx_ci
        run: python3 -m pytest tests/ -v --cov=app --cov-report=term-missing

  frontend-build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [frontend, abgabebox-frontend]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ${{ matrix.app }}/package-lock.json

      - name: Install dependencies
        working-directory: ${{ matrix.app }}
        run: npm ci

      - name: Test
        # Audit A5, 2026-08-16: both apps have a `test` script (frontend already had one
        # with 3 test files, abgabebox-frontend's is new) but neither was ever actually run
        # in CI before this - tests only guard against regressions if something runs them.
        working-directory: ${{ matrix.app }}
        run: npm test -- --coverage

      - name: Build
        working-directory: ${{ matrix.app }}
        run: npm run build

  e2e-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install npm dependencies
        working-directory: frontend
        run: npm ci

      # Browser binaries aren't part of npm's own cache (actions/setup-node above only
      # caches the npm registry tarballs) - without this, every run re-downloads the full
      # Chromium bundle from scratch. Keyed on the resolved @playwright/test version so a
      # version bump invalidates it automatically instead of running a stale browser.
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}

      - name: Install Playwright Chromium (+ OS deps)
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run isolated Playwright stack and browser tests
        env:
          CI: "true"
          E2E_USE_HOST_PLAYWRIGHT: "1"
        run: ./scripts/e2e.sh all

      - name: Upload Playwright diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/playwright/
          if-no-files-found: ignore
          retention-days: 14


  # Non-blocking vulnerability check for Python and Node dependencies.
  # Blockierendes Gate (Security-Audit release/1.2.0, SEC-005/006): eine bekannte Schwachstelle
  # in einer Python-Abhängigkeit oder eine ab HIGH in einer npm-Abhängigkeit lässt den PR-Check
  # scheitern. Die Funde stehen zusätzlich in der Job-Summary. Ein Fund ohne verfügbaren Fix wird
  # bewusst und begründet ausgenommen (pip-audit --ignore-vuln, npm overrides), nicht das Gate
  # abgeschaltet.
  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Audit Python dependencies (pip-audit)
        run: |
          set -o pipefail
          status=0
          for requirements in backend/requirements.txt abgabebox-backend/requirements.txt photo-analysis-worker/requirements.txt; do
            echo "## pip-audit: ${requirements}" >> "$GITHUB_STEP_SUMMARY"
            pip-audit -r "$requirements" -f markdown --progress-spinner off | tee -a "$GITHUB_STEP_SUMMARY" || status=1
          done
          exit "$status"

      - name: Audit Node dependencies (npm audit)
        run: |
          status=0
          for app in frontend abgabebox-frontend; do
            echo "## npm audit: ${app}" >> "$GITHUB_STEP_SUMMARY"
            ( cd "$app" && npm audit --audit-level=high --package-lock-only ) | tee -a "$GITHUB_STEP_SUMMARY"
            [ "${PIPESTATUS[0]}" -eq 0 ] || status=1
          done
          exit "$status"

  # Diff-basiert (nur auf Pull-Requests): neue Verstösse gegen SECURITY-RULES.md blockieren, bis sie
  # behoben oder in derselben Zeile begründet markiert sind - ungescopte public_id-Lookups
  # (.semgrep/tenant-scope.yml) und die Regeln aus scripts/check-security-rules.py. Dieselbe Prüfung
  # läuft lokal im Pre-Commit-Hook und für Claude Code nach jeder Dateiänderung.
  security-lint:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Install semgrep
        run: pip install semgrep==1.181.0
      - name: Neue ungescopte Lookups suchen
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: semgrep scan --config .semgrep/tenant-scope.yml --baseline-commit "$BASE_SHA" --error --metrics off backend/app
      - name: Neue Verstösse gegen SECURITY-RULES.md suchen
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python3 scripts/check-security-rules.py --base "$BASE_SHA"

  # Scans the PR diff for accidentally committed secrets. Unlike
  # dependency-audit this job is a hard gate (no continue-on-error): a newly
  # committed secret must block the merge, not just warn.
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      # gitleaks needs both the base and head commit of the PR to diff
      # against, so fetch-depth: 0 is required here (unlike the other jobs,
      # which only need the checked-out tree).
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # gitleaks/gitleaks-action: free, no license/API key needed for the
      # standard (non-Organization) usage in a private repo - it runs the
      # open-source gitleaks scanner locally in the runner. Scoped to the
      # PR's own commit range via GITLEAKS_CONFIG defaults (base/head from
      # the pull_request event), not the full repo history.
      - name: Run gitleaks secret scan
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
