name: Promote tested release images

on:
  workflow_dispatch:
    inputs:
      source_tag:
        description: "Bereits getesteter Image-Tag, z. B. test-20260825-abc1234-r42"
        required: true
        type: string
      release_tag:
        description: "Finaler Release-Tag, z. B. v1.2.0"
        required: true
        type: string
      update_latest:
        description: "Zusätzlich den moving tag 'latest' auf dieses Release zeigen lassen"
        required: true
        type: boolean
        default: true
      confirm_production:
        description: "Zum Schutz vor Fehlklicks exakt DEPLOY eingeben"
        required: true
        type: string

permissions:
  contents: read
  packages: write
  deployments: write

concurrency:
  group: hocx-production-promotion
  cancel-in-progress: false

jobs:
  verify-tested-candidate:
    runs-on: ubuntu-latest
    outputs:
      candidate_sha: ${{ steps.proof.outputs.candidate_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate production confirmation and tags
        env:
          SOURCE_TAG: ${{ inputs.source_tag }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          CONFIRM_PRODUCTION: ${{ inputs.confirm_production }}
        run: |
          set -euo pipefail
          [ "$CONFIRM_PRODUCTION" = DEPLOY ] || {
            echo "Prod-Promotion nicht bestaetigt: exakt DEPLOY eingeben." >&2
            exit 1
          }
          [[ "$SOURCE_TAG" =~ ^test-[0-9]{8}-[0-9a-f]{7,40}-r[0-9]+$ ]] || {
            echo "source_tag ist kein hocX Candidate-Tag: $SOURCE_TAG" >&2
            exit 1
          }
          tag_regex='^v?[0-9]+\.[0-9]+\.[0-9]+$'
          [[ "$RELEASE_TAG" =~ $tag_regex ]] || {
            echo "Ungueltiger release_tag: $RELEASE_TAG" >&2
            exit 1
          }

      - name: Require successful test-host verification
        id: proof
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_TAG: ${{ inputs.source_tag }}
        run: |
          set -euo pipefail
          candidate_sha="$(printf '%s' "$SOURCE_TAG" | sed -E 's/^test-[0-9]{8}-([0-9a-f]{7,40})-r[0-9]+$/\1/')"
          proof="$(gh api \
            'repos/${{ github.repository }}/deployments?environment=test&task=hocx-candidate&per_page=100' \
            --jq "first(.[] | select(.payload.candidate_tag == \"$SOURCE_TAG\")) | [.id, .sha] | @tsv")"
          read -r deployment_id deployment_sha <<< "$proof"
          [ -n "$deployment_id" ] || {
            echo "Kein Testnachweis fuer $SOURCE_TAG vorhanden." >&2
            echo "Auf dem Testhost zuerst ./scripts/verify_release.sh test ausfuehren." >&2
            exit 1
          }
          [[ "$deployment_sha" = "$candidate_sha"* ]] || {
            echo "Testnachweis gehoert zu Commit $deployment_sha, Candidate nennt aber $candidate_sha." >&2
            exit 1
          }
          state="$(gh api "repos/${{ github.repository }}/deployments/${deployment_id}/statuses" --jq '.[0].state')"
          [ "$state" = success ] || {
            echo "Letzter Teststatus fuer $SOURCE_TAG ist '$state', nicht 'success'." >&2
            exit 1
          }
          echo "Testnachweis $deployment_id fuer $SOURCE_TAG ist erfolgreich."
          echo "candidate_sha=$deployment_sha" >> "$GITHUB_OUTPUT"

      - name: Prepare changelog and check existing tag
        env:
          CANDIDATE_SHA: ${{ steps.proof.outputs.candidate_sha }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          git fetch origin "$CANDIDATE_SHA"
          if git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"; then
            [ "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")" = "$CANDIDATE_SHA" ] || {
              echo "Release-Tag zeigt auf einen anderen Commit." >&2
              exit 1
            }
          fi
          git show "$CANDIDATE_SHA:CHANGELOG.md" > "$RUNNER_TEMP/candidate-changelog.md"
          python3 scripts/release_notes.py "$RELEASE_TAG" "$RUNNER_TEMP/candidate-changelog.md" > release-notes.md

      - name: Preserve verified release notes
        uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: release-notes.md
          retention-days: 7

  promote:
    needs: verify-tested-candidate
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://hocx.ch
    strategy:
      matrix:
        service:
          - backend
          - frontend
          - abgabebox-backend
          - abgabebox-frontend
          - docs
          - photo-analysis-worker
    steps:
      - name: Lowercase image owner
        run: echo "OWNER_LC=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Validate tags
        env:
          SOURCE_TAG: ${{ inputs.source_tag }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          tag_regex='^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$'
          if ! [[ "$SOURCE_TAG" =~ $tag_regex ]]; then
            echo "Ungueltiger source_tag: $SOURCE_TAG" >&2
            exit 1
          fi
          if ! [[ "$RELEASE_TAG" =~ $tag_regex ]]; then
            echo "Ungueltiger release_tag: $RELEASE_TAG" >&2
            exit 1
          fi

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Ensure candidate image exists
        env:
          IMAGE: ghcr.io/${{ env.OWNER_LC }}/hocx-${{ matrix.service }}:${{ inputs.source_tag }}
        run: docker buildx imagetools inspect "$IMAGE" > /dev/null

      - name: Promote tested image to release tag
        env:
          SOURCE_IMAGE: ghcr.io/${{ env.OWNER_LC }}/hocx-${{ matrix.service }}:${{ inputs.source_tag }}
          RELEASE_IMAGE: ghcr.io/${{ env.OWNER_LC }}/hocx-${{ matrix.service }}:${{ inputs.release_tag }}
        run: docker buildx imagetools create -t "$RELEASE_IMAGE" "$SOURCE_IMAGE"

      - name: Update latest tag
        if: ${{ inputs.update_latest }}
        env:
          SOURCE_IMAGE: ghcr.io/${{ env.OWNER_LC }}/hocx-${{ matrix.service }}:${{ inputs.source_tag }}
          LATEST_IMAGE: ghcr.io/${{ env.OWNER_LC }}/hocx-${{ matrix.service }}:latest
        run: docker buildx imagetools create -t "$LATEST_IMAGE" "$SOURCE_IMAGE"

      - name: Write summary
        env:
          SERVICE: ${{ matrix.service }}
          SOURCE_TAG: ${{ inputs.source_tag }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          UPDATE_LATEST: ${{ inputs.update_latest }}
        run: |
          {
            echo "### ${SERVICE}"
            echo ""
            echo "- source: \`${SOURCE_TAG}\`"
            echo "- release: \`${RELEASE_TAG}\`"
            echo "- latest aktualisiert: \`${UPDATE_LATEST}\`"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

  publish-release:
    needs: [verify-tested-candidate, promote]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: release-notes

      - name: Publish GitHub release with changelog
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          CANDIDATE_SHA: ${{ needs.verify-tested-candidate.outputs.candidate_sha }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          SOURCE_TAG: ${{ inputs.source_tag }}
          UPDATE_LATEST: ${{ inputs.update_latest }}
        run: |
          set -euo pipefail
          # Auch bei Wiederholungen niemals einen vorhandenen Tag verschieben.
          if git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"; then
            [ "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")" = "$CANDIDATE_SHA" ] || {
              echo "Release-Tag zeigt auf einen anderen Commit." >&2
              exit 1
            }
          else
            gh api "repos/$GH_REPO/git/refs" -f ref="refs/tags/$RELEASE_TAG" -f sha="$CANDIDATE_SHA"
          fi
          {
            printf '\n## Build\n\n- Getesteter Commit: `%s`\n- Testkandidat: `%s`\n' "$CANDIDATE_SHA" "$SOURCE_TAG"
            printf '\n### Container-Images\n\n'
            for service in backend frontend abgabebox-backend abgabebox-frontend docs photo-analysis-worker; do
              printf -- '- `ghcr.io/%s/hocx-%s:%s`\n' "${GITHUB_REPOSITORY_OWNER,,}" "$service" "$RELEASE_TAG"
            done
          } >> release-notes.md
          if gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft' > "$RUNNER_TEMP/release-draft"; then
            if [ "$(cat "$RUNNER_TEMP/release-draft")" = true ]; then
              gh release edit "$RELEASE_TAG" --draft=false --title "hocX $RELEASE_TAG" --notes-file release-notes.md --latest="$UPDATE_LATEST"
            else
              echo "Release bereits veröffentlicht; bleibt unverändert."
            fi
          else
            gh release create "$RELEASE_TAG" --verify-tag --title "hocX $RELEASE_TAG" --notes-file release-notes.md --latest="$UPDATE_LATEST"
          fi
          gh release view "$RELEASE_TAG" --json url --jq '.url' >> "$GITHUB_STEP_SUMMARY"
