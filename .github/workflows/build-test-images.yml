name: Build test candidate images

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      git_ref: ${{ steps.meta.outputs.git_ref }}
      git_sha: ${{ steps.meta.outputs.git_sha }}
      image_tag: ${{ steps.meta.outputs.image_tag }}
    steps:
      - name: Derive candidate metadata
        id: meta
        env:
          GIT_REF: ${{ github.ref_name }}
          GIT_SHA: ${{ github.sha }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          short_sha="${GIT_SHA::7}"
          build_date="$(date -u +%Y%m%d)"
          image_tag="test-${build_date}-${short_sha}-r${RUN_NUMBER}"
          echo "git_ref=${GIT_REF}" >> "$GITHUB_OUTPUT"
          echo "git_sha=${GIT_SHA}" >> "$GITHUB_OUTPUT"
          echo "image_tag=${image_tag}" >> "$GITHUB_OUTPUT"
          {
            echo "## Candidate metadata"
            echo ""
            echo "- ref: \`${GIT_REF}\`"
            echo "- sha: \`${GIT_SHA}\`"
            echo "- image tag: \`${image_tag}\`"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

  build-push:
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - name: backend
            context: ./backend
          - name: frontend
            context: ./frontend
          - name: abgabebox-backend
            context: ./abgabebox-backend
          - name: abgabebox-frontend
            context: ./abgabebox-frontend
          - name: docs
            context: ./docs-site
          - name: photo-analysis-worker
            context: ./photo-analysis-worker
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.prepare.outputs.git_sha }}

      - name: Lowercase image owner
        run: echo "OWNER_LC=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: Build and push candidate image
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: ${{ matrix.service.context }}
          push: true
          tags: ghcr.io/${{ env.OWNER_LC }}/hocx-${{ matrix.service.name }}:${{ needs.prepare.outputs.image_tag }}
          cache-from: type=gha,scope=${{ matrix.service.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service.name }}

      - name: Install Cosign
        uses: sigstore/cosign-installer@d58896d6a1865668819e1d91763c7751a165e159 # v3.9.2
      - name: Sign candidate image by immutable digest
        env:
          IMAGE: ghcr.io/${{ env.OWNER_LC }}/hocx-${{ matrix.service.name }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "$IMAGE@$DIGEST"

      - name: Write summary
        env:
          SERVICE: ${{ matrix.service.name }}
          GIT_REF: ${{ needs.prepare.outputs.git_ref }}
          GIT_SHA: ${{ needs.prepare.outputs.git_sha }}
          IMAGE_TAG: ${{ needs.prepare.outputs.image_tag }}
        run: |
          {
            echo "### ${SERVICE}"
            echo ""
            echo "- ref: \`${GIT_REF}\`"
            echo "- sha: \`${GIT_SHA}\`"
            echo "- candidate tag: \`${IMAGE_TAG}\`"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

  sign-deploy-code:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact candidate commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.prepare.outputs.git_sha }}

      - name: Create deploy-code manifest
        env:
          GIT_SHA: ${{ needs.prepare.outputs.git_sha }}
        run: |
          set -euo pipefail
          printf '%s\n' "$GIT_SHA" > deploy-code.commit
          git ls-files -z -- \
            '.github/workflows/*.yml' \
            'docker-compose*.yml' \
            'scripts/**' \
            'infra/traefik/**' \
            'infra/garage/**' \
            | LC_ALL=C sort -z \
            | xargs -0 sha256sum > deploy-code.manifest
          test -s deploy-code.manifest

      - name: Install Cosign
        uses: sigstore/cosign-installer@d58896d6a1865668819e1d91763c7751a165e159 # v3.9.2
      - name: Sign deploy-code manifest
        run: cosign sign-blob --yes --bundle deploy-code.bundle deploy-code.manifest

      - name: Upload signed deploy-code proof
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: deploy-code-${{ needs.prepare.outputs.git_sha }}
          path: |
            deploy-code.commit
            deploy-code.manifest
            deploy-code.bundle
          if-no-files-found: error
          retention-days: 90
