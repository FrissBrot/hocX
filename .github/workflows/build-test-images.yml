name: Build test candidate images

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      git_ref: ${{ steps.meta.outputs.git_ref }}
      git_sha: ${{ steps.meta.outputs.git_sha }}
      image_tag: ${{ steps.meta.outputs.image_tag }}
    steps:
      - name: Derive candidate metadata
        id: meta
        env:
          GIT_REF: ${{ github.ref_name }}
          GIT_SHA: ${{ github.sha }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          short_sha="${GIT_SHA::7}"
          build_date="$(date -u +%Y%m%d)"
          image_tag="test-${build_date}-${short_sha}-r${RUN_NUMBER}"
          echo "git_ref=${GIT_REF}" >> "$GITHUB_OUTPUT"
          echo "git_sha=${GIT_SHA}" >> "$GITHUB_OUTPUT"
          echo "image_tag=${image_tag}" >> "$GITHUB_OUTPUT"
          {
            echo "## Candidate metadata"
            echo ""
            echo "- ref: \`${GIT_REF}\`"
            echo "- sha: \`${GIT_SHA}\`"
            echo "- image tag: \`${image_tag}\`"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

  build-push:
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - name: backend
            context: ./backend
          - name: frontend
            context: ./frontend
          - name: abgabebox-backend
            context: ./abgabebox-backend
          - name: abgabebox-frontend
            context: ./abgabebox-frontend
          - name: docs
            context: ./docs-site
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.git_sha }}

      - name: Lowercase image owner
        run: echo "OWNER_LC=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push candidate image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.service.context }}
          push: true
          tags: ghcr.io/${{ env.OWNER_LC }}/hocx-${{ matrix.service.name }}:${{ needs.prepare.outputs.image_tag }}
          cache-from: type=gha,scope=${{ matrix.service.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service.name }}

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3.9.2

      - name: Sign candidate image by immutable digest
        env:
          IMAGE: ghcr.io/${{ env.OWNER_LC }}/hocx-${{ matrix.service.name }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "$IMAGE@$DIGEST"

      - name: Write summary
        env:
          SERVICE: ${{ matrix.service.name }}
          GIT_REF: ${{ needs.prepare.outputs.git_ref }}
          GIT_SHA: ${{ needs.prepare.outputs.git_sha }}
          IMAGE_TAG: ${{ needs.prepare.outputs.image_tag }}
        run: |
          {
            echo "### ${SERVICE}"
            echo ""
            echo "- ref: \`${GIT_REF}\`"
            echo "- sha: \`${GIT_SHA}\`"
            echo "- candidate tag: \`${IMAGE_TAG}\`"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"
