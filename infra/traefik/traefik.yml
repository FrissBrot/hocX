api:
  # Was `true` with no router ever defined for it anywhere in this repo (verified: no
  # reference to api@internal or the dashboard port) - unreachable today only because
  # nothing routes to it, which is a trap for whoever adds a router later without
  # realizing the dashboard has no auth in front of it (see audit finding F-Niedrig-1).
  # Disabled outright since it's unused; re-enable deliberately with an authed router
  # (e.g. basicauth/forwardauth middleware) if the dashboard is ever actually needed.
  dashboard: false

# Client-IP (MAIN-SEC-007): Ohne forwardedHeaders.trustedIPs vertraut Traefik keinen vom
# Client mitgeschickten X-Forwarded-*-Headern und setzt X-Forwarded-For selbst auf die
# Quelladresse. Das Backend liest die IP daraus (app/core/client_ip.py) für Login-Sperre und
# Rate-Limits. Steht später ein weiterer Proxy/CDN davor, dessen Adressbereiche hier je
# EntryPoint unter forwardedHeaders.trustedIPs eintragen - sonst teilen sich alle Clients die
# IP des CDN. Über den Admin-Einstieg (OpenZiti, 127.0.0.1) sehen alle Zugriffe dieselbe IP.
entryPoints:
  web:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
  websecure:
    address: ":443"
    # MAIN-OPS-013: Traefik kennt Timeouts nur pro EntryPoint. readTimeout begrenzt den ganzen
    # Request inkl. Body (live geprüft) - 1 h reicht für alle Uploads ausser sehr grossen
    # Galerie-ZIPs bei langsamer Leitung (das UI empfiehlt dann den Ordner-Upload in Teilen).
    # WebSockets (Kollaboration) laufen über beide Timeouts hinaus weiter, Traefik hebt die
    # Fristen beim Upgrade auf (live geprüft). Vorher 3h/unbegrenzt.
    transport:
      respondingTimeouts:
        readTimeout: 1h
        writeTimeout: 1h
    http:
      # Audit finding (Low), 2026-08-27: baseline security headers (HSTS etc., defined in
      # infra/traefik/dynamic/security.yml) for every router on this entrypoint, so origins
      # that don't set their own headers still get a consistent policy. The TLS minimum
      # version/cipher suite policy lives in that same file as the `default` tls.options
      # profile, which Traefik applies automatically without listing it here.
      middlewares:
        - security-headers@file
  # Private Admin-Einstieg. Der Host-Port wird in Compose ausschliesslich an
  # 127.0.0.1 gebunden und ist damit als Ziel fuer den OpenZiti-Host-Tunnel
  # erreichbar, aber nicht direkt aus dem Internet.
  adminsecure:
    address: ":8443"
    # Concurrency-Audit CONC-021: ohne eigene Angabe gilt Traefiks Default readTimeout von 60 s -
    # ein Mandantenimport (bis 2 GiB, gepuffert) über einen langsameren Admin-Zugang brach ab.
    # Gleiche Fristen wie websecure.
    transport:
      respondingTimeouts:
        readTimeout: 1h
        writeTimeout: 1h
    http:
      middlewares:
        - security-headers@file

providers:
  docker:
    # Nur über den Lese-Proxy (MAIN-OPS-004), siehe traefik-socket-proxy in den Compose-Dateien.
    endpoint: "tcp://traefik-socket-proxy:2375"
    exposedByDefault: false
  file:
    directory: /etc/traefik/dynamic
    watch: true

certificatesResolvers:
  letsencrypt:
    acme:
      # E-Mail kommt aus der TRAEFIK_CERTIFICATESRESOLVERS_LETSENCRYPT_ACME_EMAIL
      # Env-Variable (siehe docker-compose.yml) - Traefik ersetzt "${...}" hier NICHT,
      # das ist reine YAML-Syntax ohne Substitution.
      storage: /letsencrypt/acme.json
      httpChallenge:
        entryPoint: web
  # Der private Admin-Listener ist fuer Let's Encrypt nicht erreichbar. DNS-01
  # weist die Domaininhaberschaft stattdessen ueber einen kurzlebigen Cloudflare-
  # TXT-Record nach. CF_DNS_API_TOKEN kommt aus .env.
  letsencryptdns:
    acme:
      storage: /letsencrypt/acme-dns.json
      dnsChallenge:
        provider: cloudflare
