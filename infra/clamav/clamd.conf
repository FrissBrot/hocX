# Die Upload-APIs lassen höchstens 100 MiB pro gescannter Datei zu.
LogFile /var/log/clamav/clamd.log
LogTime yes
LocalSocket /tmp/clamd.sock
TCPSocket 3310
User clamav
DatabaseDirectory /var/lib/clamav
StreamMaxLength 100M
MaxFileSize 100M
MaxScanSize 400M
MaxRecursion 17
MaxFiles 10000
AlertExceedsMax yes
# Concurrency-Audit CONC-013: 3 Scan-Threads bei 1.5 CPU (Container-Limit), Warteschlange für
# Upload-Spitzen; die Clients begrenzen sich zusätzlich auf 2 Verbindungen je Prozess.
MaxThreads 3
MaxQueue 32
ReadTimeout 120
CommandReadTimeout 30
