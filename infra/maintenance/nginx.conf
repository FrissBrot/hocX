# Wartungsseite (Dienst maintenance-page in docker-compose.traefik.yml, RUNBOOK Abschnitt 20).
#
# Traefik schickt nur feste Pfade hierher, nie die Pfade der Nutzer:
#   /_hocx, /_admin, /_abgabebox  HTML-Wartungsseite (Variante je Domain)
#   /_api                         JSON-503 für API-Aufrufe
# - die errors-Middlewares (infra/traefik/dynamic/maintenance.yml, Option `query`) und
# - die Ausweich-Router (Labels am Dienst, Middleware replacePath).
# Jede Antwort ist 503 mit Retry-After und Cache-Control: no-store - nie 200, damit Healthchecks,
# Uptime Kuma und deploy.sh die Wartungsseite nie für eine laufende App halten. Einzige Ausnahme:
# /healthz für den Container-Healthcheck (nur im Container erreichbar, kein Router zeigt darauf).
#
# Die Konfiguration liest nginx nur beim Start (deploy.sh erstellt den Dienst bei einer Änderung
# neu, sync_maintenance_page_config); HTML/JSON/tokens.css liest es bei jeder Anfrage.

worker_processes 1;
pid /tmp/nginx.pid;
error_log stderr warn;

events {
  worker_connections 512;
}

http {
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;

  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  charset utf-8;
  charset_types application/json text/css;

  # Keine Zugriffsprotokolle: die Seite verarbeitet keine Benutzerdaten, und IP-Adressen der
  # Besucher während eines Updates braucht niemand.
  access_log off;
  server_tokens off;
  sendfile on;
  keepalive_timeout 30;
  # Unbegrenzt: Ein Upload, der während eines Ausfalls hier landet (Ausweich-Router), bekäme bei
  # einem Limit 413 statt 503 - der Client hielte das für «Datei zu gross» statt «später
  # nochmals». `return 503` liest den Body nicht in eine Datei, nginx verwirft ihn.
  client_max_body_size 0;

  # $request_uri bleibt bei der internen Weiterleitung (error_page) unverändert.
  map $request_uri $hocx_variant {
    default hocx;
    ~^/_admin(\?|$) admin;
    ~^/_abgabebox(\?|$) abgabebox;
  }
  # Admin-Zugang: /api/health landet dort beim Admin-Frontend, nicht beim Backend - geprüft wird
  # /api/admin/auth/health (Admin-API über den Admin-Entrypoint, ohne Session und Datenbank).
  map $hocx_variant $hocx_health {
    default /api/health;
    admin /api/admin/auth/health;
  }

  server {
    listen 8080 default_server;
    root /srv/maintenance;

    location = /healthz {
      default_type text/plain;
      return 200 "ok\n";
    }

    location = /_api {
      error_page 503 /api-503.json;
      return 503;
    }

    location / {
      error_page 503 /maintenance.html;
      return 503;
    }

    location = /maintenance.html {
      internal;
      ssi on;
      # Inline-Skript nur per Hash (scripts/tests/test_maintenance_page.sh prüft ihn), Styles
      # inline (tokens.css per SSI eingebettet), Abfragen nur an die eigene Domain.
      add_header Content-Security-Policy "default-src 'none'; script-src 'sha256-oPZZBk5hZaC8PA3nrLzkHIczDdT9v+1N1eYLff6nCiA='; style-src 'unsafe-inline'; connect-src 'self'; img-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
      add_header Cache-Control "no-store" always;
      add_header Retry-After "30" always;
      add_header X-Hocx-Maintenance-Page "1" always;
      add_header X-Content-Type-Options "nosniff" always;
      add_header Referrer-Policy "no-referrer" always;
    }

    location = /api-503.json {
      internal;
      default_type application/json;
      add_header Cache-Control "no-store" always;
      add_header Retry-After "30" always;
      add_header X-Hocx-Maintenance-Page "1" always;
      add_header X-Content-Type-Options "nosniff" always;
    }

    # Nur für die SSI-Einbettung in maintenance.html.
    location = /tokens.css {
      internal;
    }

    # Update-Info (Versionen, Beginn, optional Statusseite), schreibt deploy.sh
    # (write_maintenance_info). Nur per SSI eingebettet; fehlt sie, setzt die Seite {} ein.
    location = /update-info.json {
      internal;
      log_not_found off;
    }
  }
}
